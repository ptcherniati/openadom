# On désactive le cache de preparedStatement car sinon, on risque de tomber sur une
# org.postgresql.util.PSQLException: ERROR: cached plan must not change result type
# qui est dû au fait que entre deux tests, flyway écrase et recrée la base de données
# or, si on réutilise un preparedStatement créé sur le schéma du test précédent, ça échoue


spring.datasource.driver-class-name=org.postgresql.Driver
# Configuration Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:migration/main
spring.flyway.baseline-on-migrate=true

spring.flyway.driver-class-name=org.postgresql.Driver
spring.flyway.user=openAdomTechUser
spring.flyway.password=z2I<i}qclq)D?xqT
# Configuration de base pour les tests
spring.main.allow-bean-definition-overriding=true

# Désactiver les éléments non nécessaires pour les tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.mail.test-connection=false

# Configuration de sécurité minimale pour les tests
jwtSecret=test_secret_key_for_testing_purposes_only
jwtExpiration=3600
# Cle JWT propagee a JWTExtractor ( @Value("${jwt.secret}") ) pour les tests.
# Doit faire au moins 32 octets ( cf. JWTExtractor.MIN_JWT_SECRET_BYTES ).
jwt.secret=test_secret_key_for_testing_purposes_only_at_least_32_bytes
jwt.expiration=3600

# Désactiver les vérifications de sécurité CSRF pour faciliter les tests
spring.security.csrf.disabled=true

# Configuration de logging pour les tests
logging.level.org.springframework.security=INFO
logging.level.fr.inra.oresing=DEBUG

# -- Diagnostic SQL / transactions ---------------------------------------------
# Désactivés par défaut : passer en DEBUG/TRACE pour déboguer un problème SQL,
# de transaction ou de rôle PostgreSQL.
logging.level.org.springframework.jdbc.core.JdbcTemplate=INFO
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=INFO
logging.level.org.springframework.transaction.interceptor=INFO
logging.level.org.springframework.transaction.support.AbstractPlatformTransactionManager=INFO
logging.level.org.flywaydb=INFO
logging.level.org.postgresql=INFO
# Les requêtes diagnostiques de AbstractIntegrationTest sont en log.debug :
# passer à DEBUG pour les réactiver (ex. pour analyser un problème de droits PG).
logging.level.fr.inra.oresing.rest.services.AbstractIntegrationTest=INFO
viewStrategy=DISABLED

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

filesender.baseurl=https://filesender.renater.fr/rest.php
filesender.username=mail@user.fr
filesender.apikey=an_api_key

# Désactive les virtual threads pour les executors custom en test.
# Raison : Spring MockMvc + StreamingResponseBody + virtual thread provoquent
# une ConcurrentModificationException sur MockHttpServletResponse (non
# thread-safe, LinkedCaseInsensitiveMap) lorsque le thread de test lit la
# réponse pendant que le virtual thread y écrit les headers de sécurité.
# Effet limité aux tests : la prod conserve les virtual threads.
executor.use-virtual-threads=false

# === Workflow lifecycle observability : désactivé en test ===
# Raison : CascadeHeartbeatBridge subscribe au singleton statique
# WorkflowEventBus.getInstance() (JVM-wide). Chaque test class crée un
# nouveau Spring context et donc un nouveau bridge ; les subscribers
# s'accumulent et chaque WorkflowAliveEvent fire N writes DB en parallele
# (repository.beat) qui saturent le pool Hikari pendant les tests cascade
# multi-class. Le sweeper @Scheduled toutes les 5 min ajoute aussi du
# bruit / pression DB inutile en test. Les tests dediés a ces beans
# instancient leur propre context isole.
app.workflow.zombie-enabled=false
app.workflow.cascade-heartbeat.enabled=false
# Timeout court pour les imports lourds en test : un import qui hangerait
# (cf TestReferencesErrors, app_test_monsoere) echoue rapidement via
# TimeoutException dans OreSiResources.createData(), au lieu de bloquer
# indefiniment le thread de test et de produire un timeout JUnit ambigu.
openadom.http.streaming.timeout=3m

# === Postgres : detection precoce des blocages transactionnels en test ===
# Plutot que de laisser une tx attendre indefiniment un lock ou rester
# "idle in transaction" pendant des minutes (self-deadlock applicatif ,
# resource leak , forget commit/rollback) , on configure Postgres pour
# echouer vite avec un SQLSTATE explicite . Un test qui presente un
# probleme de tx remontera ainsi une erreur claire ( PSQLException
# "55P03 lock_timeout" ou "25P03 idle_in_transaction_session_timeout" )
# au lieu d'un blocage opaque qu'on doit diagnostiquer a coups de
# thread-dump + pg_stat_activity.
#
# - lock_timeout = 15s : abort toute requete qui attend un lock > 15s
#   ( typique self-deadlock REQUIRES_NEW vs tx outer : cf bug
#   compensateNow VersioningService.createData reproduit sur
#   "ajout d'un fichier invalide" 2026-05-22 )
# - idle_in_transaction_session_timeout = 60s : ferme la session si une
#   tx reste ouverte sans activite > 60s ( forget commit / rollback )
# - deadlock_timeout = 500ms : Postgres scrute le graphe de waits 2x plus
#   vite ( default 1s ) pour reperer les deadlocks reels rapidement
#
# Ces seuils sont volontairement plus courts qu'en prod : on veut amplifier
# la sensibilite des tests aux bugs transactionnels , pas autoriser des
# imports legitimes longs ( qui doivent etre couverts par cascade.*.timeout ) .
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '15s'; SET idle_in_transaction_session_timeout = '60s'; SET deadlock_timeout = '500ms'