version: 1
application:
  defaultLanguage: fr
  internationalizationName:
    fr: SOERE mon SOERE avec dépôt
    en: SOERE my SOERE with repository
  name: MONSORES
  version: 1

tags:
  context:
    fr: contexte
    en: context
  data:
    fr: données
    en: data
  test:
    fr: test
    en: test
  unit:
    fr: unité
    en: unit
rightsRequest:
  description:
    fr: Vous pouvez demander des droits à l'application monsore en remplissant ce formulaire
    en: You can request rights to the monsore application by filling out this form
  format:
    organization:
      internationalizationName:
        fr: Nom de l'organisme de recherche
        en: Name of research organization
      checker:
        name: String
        params:
          pattern: ".*"
          required: true
    project:
      internationalizationName:
        fr: Description du projet de recherche
        en: Description of the research project
      checker:
        name: String
        params:
          pattern: ".*"
          required: false
    startDate:
      internationalizationName:
        fr: Date de début du projet
        en: Project start date
      checker:
        name: Date
        params:
          pattern: "dd/MM/yyyy"
    endDate:
      internationalizationName:
        fr: Date de fin du projet
        en: Project end date
      checker:
        name: Date
        params:
          pattern: "dd/MM/yyyy"
    projectManagers:
      internationalizationName:
        fr: Responsables du projet
        en: Project managers
      checker:
        name: String
        params:
          pattern: ".*"
          required: false
          multiplicity: MANY

additionalFiles:
  fichiers:
    internationalizationName:
      fr: Fichiers
      en: Files
    format:
      nom:
        internationalizationName:
          fr: Nom
          en: Name
        checker:
          name: String
          params:
            pattern: "[a-z]*"
      date:
        internationalizationName:
          fr: Date
          en: Date
        checker:
          name: Date
          params:
            pattern: "dd/MM/yyyy"
      age:
        internationalizationName:
          fr: Age
          en: Age
        checker:
          name: Integer
      poids:
        internationalizationName:
          fr: Poids
          en: Weight
        checker:
          name: Float
          params:
            required: false
      site:
        internationalizationName:
          fr: Site
          en: Place
        checker:
          name: Reference
          params:
            refType: sites
            required: true
  utilisateurs:
    internationalizationName:
      fr: Users
      en: User
    format:
      nom:
        internationalizationName:
          fr: Nom
          en: Name
        checker:
          name: String
          params:
            pattern: "[a-z]*"
      prenom:
        internationalizationName:
          fr: Prénom
          en: Surname
        checker:
          name: String
          params:
            pattern: "[a-z]*"

compositeReferences:
  sites:
    components:
      - reference: type_de_sites
      - parentKeyColumn: tze_type_nom
        parentRecursiveKey: zet_chemin_parent
        reference: sites
  projet:
    components:
      - reference: projet
references:
  especes:
    tags: [data]
    internationalizationName:
      fr: Espèces
      en: Species
    internationalizedColumns:
      esp_definition_fr:
        fr: esp_definition_fr
        en: esp_definition_en
    internationalizationDisplay:
      pattern:
        fr: '{esp_nom}'
        en: '{esp_nom}'
    keyColumns:
      - esp_nom
    columns:
      esp_nom:
        tags: [test]
      esp_definition_fr: null
      esp_definition_en: null
      colonne_homonyme_entre_referentiels: null
    computedColumns:
      my_computed_column:
        tags: [__hidden__]
        computation:
          expression: >
            return "my value";

  projet:
    tags: [context, data, test]
    internationalizationName:
      fr: Projet
      en: Project
    internationalizedColumns:
      nom_key:
        fr: nom_fr
        en: nom_en
      definition_fr:
        fr: definition_fr
        en: definition_en
    internationalizationDisplay:
      pattern:
        fr: '{nom_key}'
        en: '{nom_key}'
    keyColumns:
      - nom_key
    columns:
      nom_key: null
      nom_fr: null
      nom_en: null
      definition_fr: null
      definition_en: null
      colonne_homonyme_entre_referentiels: null
  sites:
    tags: [context]
    validations:
      typeSitesRef:
        internationalizationName:
          fr: référence au type de site
        checker:
          name: Reference
          params:
            refType: type_de_sites
        columns: [ tze_type_nom ]
      siteParentRef:
        internationalizationName:
          fr: référence à la colonne parent
        checker:
          name: Reference
          params:
            refType: sites
            required: false
        columns: [ zet_chemin_parent ]
    keyColumns:
      - zet_chemin_parent
      - zet_nom_key
    internationalizationName:
      fr: Site
      en: Site
    internationalizedColumns:
      zet_nom_key:
        fr: zet_nom_fr
        en: zet_nom_en
      zet_description_fr:
        fr: zet_description_fr
        en: zet_description_en
    internationalizationDisplay:
      pattern:
        fr: '{zet_nom_key}'
        en: '{zet_nom_key}'
    columns:
      tze_type_nom: null
      zet_nom_key: null
      zet_nom_fr: null
      zet_nom_en: null
      zet_description_fr: null
      zet_description_en: null
      zet_chemin_parent: null
  themes:
    tags: [context]
    keyColumns:
      - nom_key
    internationalizationName:
      fr: Thème
      en: Thematic
    internationalizedColumns:
      nom_key:
        fr: nom_fr
        en: nom_en
      description_fr:
        fr: description_fr
        en: description_en
    internationalizationDisplay:
      pattern:
        fr: '{nom_key}'
        en: '{nom_key}'
    columns:
      nom_key: null
      nom_fr: null
      nom_en: null
      description_fr: null
      description_en: null
  type_de_fichiers:
    tags: ["__hidden__"]
    keyColumns:
      - nom_key
    internationalizationName:
      fr: Types de fichiers
      en: Files types
    internationalizedColumns:
      nom_key:
        fr: nom_fr
        en: nom_en
      description_fr:
        fr: description_fr
        en: description_en
    internationalizationDisplay:
      pattern:
        fr: '{nom_key}'
        en: '{nom_key}'
    columns:
      nom_key: null
      nom_fr: null
      nom_en: null
      description_fr: null
      description_en: null
  type_de_sites:
    tags: [context]
    keyColumns:
      - tze_nom_key
    internationalizationName:
      fr: Types de sites
      en: Sites types
    internationalizedColumns:
      tze_nom_key:
        fr: tze_nom_fr
        en: tze_nom_en
      tze_definition_fr:
        fr: tze_definition_fr
        en: tze_definition_en
    internationalizationDisplay:
      pattern:
        fr: '{tze_nom_key}'
        en: '{tze_nom_key}'
    columns:
      tze_nom_key: null
      tze_nom_fr: null
      tze_nom_en: null
      tze_definition_fr: null
      tze_definition_en: null
  site_theme_datatype:
    tags: [context]
    internationalizationName:
      fr: Types de données par site et projet
      en: Data types by site and project
    internationalizationDisplay:
      pattern:
        fr: >-
          nom du projet: {projet}, nom du site : {site}, nom du
          thème : {theme}, nom du type de données : {datatype}
        en: >-
          projet name: {projet}, site name : {site}, theme name :
          {theme}, data type name : {datatype}
    validations:
      projetRef:
        internationalizationName:
          fr: référence au projet
        checker:
          name: Reference
          params:
            refType: projet
        columns: [ projet ]
      sitesRef:
        internationalizationName:
          fr: référence au site
        checker:
          name: Reference
          params:
            refType: sites
        columns: [ site ]
      themesRef:
        internationalizationName:
          fr: référence au theme
        checker:
          name: Reference
          params:
            refType: themes
        columns: [ theme ]
      checkDatatype:
        internationalizationName:
          fr: test
        columns: [ datatype ]
        checker:
          name: GroovyExpression
          params:
            groovy:
              expression: >
                String datatype = datum.datatype;
                return  application.getConfiguration().i18n().data
                  .collect {it->it.value.i18n.get(java.util.Locale.FRENCH)}
                  .find{it->datatype.equals(fr.inra.oresing.domain.application.configuration.Ltree.fromUnescapedString(it.toString()).sql)}!=null;
    keyColumns:
      - projet
      - site
      - theme
      - datatype
    columns:
      projet:
        headerName: nom du projet
      site:
        headerName: nom du site
      theme:
        headerName: nom du thème
      datatype:
        headerName: nom du type de données
  unites:
    tags: [data]
    keyColumns:
      - nom_key
    internationalizationName:
      fr: Unités
      en: Units
    internationalizedColumns:
      code_key:
        fr: code_fr
        en: code_en
      nom_key:
        fr: nom_fr
        en: nom_en
    internationalizationDisplay:
      pattern:
        fr: '{nom_key} ({code_key})'
        en: '{nom_key} ({code_key})'
    columns:
      code_key: null
      code_fr: null
      code_en: null
      nom_key: null
      nom_fr: null
      nom_en: null
  valeurs_qualitatives:
    tags: [data]
    keyColumns:
      - nom_key
      - valeur_key
    internationalizationName:
      fr: Valeurs qualitatives
      en: Qualitative values
    internationalizedColumns:
      nom_key:
        fr: nom_fr
        en: nom_en
      valeur_key:
        fr: valeur_fr
        en: valeur_en
    internationalizationDisplay:
      pattern:
        fr: '{valeur_key}'
        en: '{valeur_key}'
    columns:
      nom_key: null
      nom_fr: null
      nom_en: null
      valeur_key: null
      valeur_fr: null
      valeur_en: null
  variables:
    tags: [data]
    keyColumns:
      - nom_key
    internationalizationName:
      fr: Variables
      en: Variables
    internationalizedColumns:
      nom_key:
        fr: nom_fr
        en: nom_en
      definition_fr:
        fr: definition_fr
        en: definition_en
    internationalizationDisplay:
      pattern:
        fr: '{nom_key}'
        en: '{nom_key}'
    columns:
      nom_key: null
      nom_fr: null
      nom_en: null
      definition_fr: null
      definition_en: null
      is_qualitative:
        headerName: isQualitative
  variables_et_unites_par_types_de_donnees:
    tags: [data]
    validations:
      variableRef:
        internationalizationName:
          fr: référence à la variable
        checker:
          name: Reference
          params:
            refType: variables
        columns: [ variable ]
      uniteRef:
        internationalizationName:
          fr: référence à l'unité'
        checker:
          name: Reference
          params:
            refType: unites
        columns: [ unite ]
      checkDatatype:
        internationalizationName:
          fr: test
        columns: [ datatype ]
        checker:
          name: GroovyExpression
          params:
            groovy:
              expression: >
                String datatype = datum.datatype;
                return  application.getConfiguration().i18n().data
                  .collect {
                      it->it.value.i18n.get(java.util.Locale.FRENCH)}
                      .find{it->datatype.equals(fr.inra.oresing.domain.application.configuration.Ltree.fromUnescapedString(it.toString()).sql)}!=null;
    keyColumns:
      - datatype
      - variable
    internationalizationName:
      fr: Variables et unités par type de données
      en: Variables and units by data type
    internationalizationDisplay:
      pattern:
        fr: >-
          nom du type de données : {datatype}, nom de la variable
          : {variable}, : nom de l'unité {unite}
        en: >-
          datatype name : {datatype}, variable name : {variable}, : unit name {unite}
    columns:
      datatype:
        headerName: nom du type de données
      variable:
        headerName: nom de la variable
      unite:
        headerName: nom de l'unité
dataTypes:
  pem:
    tags: [context, data, test]
    internationalizationName:
      fr: Piégeage en Montée
      en: Trap in ascent
    internationalizationDisplays:
      especes:
        pattern:
          fr: 'espèce :{esp_nom}'
          en: 'espèce :{esp_nom}'
    repository:
        filePattern: "(.*)_(.*)_(.*)_(.*).csv"
        authorizationScope: 
          localization: 1
          projet: 2
        startDate: 
          token: 3
        endDate: 
          token: 4
    data:
      projet:
        tags: [test]
        components:
          value:
            tags: [test]
            checker:
              name: Reference
              params:
                refType: projet
      site:
        components:
          bassin: null
          plateforme: null
          chemin:
            defaultValue:
              expression: >
                return references.sites
                        .findAll(){it.refValues.zet_chemin_parent.equals((String)datum.site.bassin)}
                        .find{it.refValues.zet_nom_key.equals((String)datum.site.plateforme)}
                        .getNaturalKey();;
              references:
                - sites
            checker:
              name: Reference
              params:
                refType: sites
        computedComponents:
          site_bassin:
            tags: [__hidden__]
            computation:
              expression: >
                return references.sites
                .find{it.getNaturalKey().equals((String)datum.site.bassin)}
                .getNaturalKey();
              references:
                - sites
            checker:
              name: Reference
              params:
                refType: sites
      date:
        components:
          value:
            checker:
              name: Date
              params:
                pattern: dd/MM/yyyy
                required: null
      espece:
        components:
          value:
            checker:
              name: Reference
              params:
                refType: OA_data.yaml
      Couleur des individus:
        components:
          value:
            checker:
              name: Reference
              params:
                refType: valeurs_qualitatives
          unit:
            defaultValue:
              expression: return "sans_unite"
            checker:
              name: Reference
              params:
                refType: unites
                required: null
      Nombre d'individus:
        components:
          value:
            defaultValue:
              expression: return 0
            checker:
              name: Integer
              params:
                required: null
          unit:
            defaultValue:
              expression: return "sans_unite"
            checker:
              name: Reference
              params:
                refType: unites
                required: null
    validations:
      unitOfColor:
        internationalizationName:
          fr: vérifie l'unité de la couleur des individus
        checker:
          name: GroovyExpression
          params:
            groovy:
              expression: >
                String datatype = "piegeage_en_montee"; 
                String variable = "Couleur des individus"; 
                String codeVariable = "couleur_des_individus"; 
                String component = "unit"; 
                return
                referencesValues.site_theme_datatype
                .findAll{it.datatype.equals(datatype)}
                .find{it.variable.equals(codeVariable)}
                .unite.equals((String)datum.variable.component)
              references:
                - variables_et_unites_par_types_de_donnees
      unitOfIndividus:
        internationalizationName:
          fr: vérifie l'unité du nombre d'individus
        checker:
          name: GroovyExpression
          params:
            groovy:
              expression: >
                String datatype = "piegeage_en_montee"; 
                String variable = "Nombre d'individus"; 
                String codeVariable = "nombre_d_individus"; String component = "unit"; 
                return referencesValues.get("variables_et_unites_par_types_de_donnees")
                .findAll{it.get("nom du type de données").equals(datatype)}
                .find{it.get("nom de la variable").equals(codeVariable)}
                .get("nom de l'unité").equals((String)datum.variable.component);
              references:
                - variables_et_unites_par_types_de_donnees
    format:
      headerLine: 4
      firstRowLine: 5
      columns:
        - header: projet
          boundTo:
            variable: projet
            component: value
        - header: site
          boundTo:
            variable: site
            component: bassin
        - header: plateforme
          boundTo:
            variable: site
            component: plateforme
        - header: date
          boundTo:
            variable: date
            component: value
        - header: espece
          boundTo:
            variable: espece
            component: value
        - header: Couleur des individus
          boundTo:
            variable: Couleur des individus
            component: value
        - header: Nombre d'individus
          boundTo:
            variable: Nombre d'individus
            component: value
    authorization:
      authorizationScopes:
        projet:
          internationalizationName:
            fr: Projet
            en: Project
          variable: projet
          component: value
        localization:
          internationalizationName:
            fr: Localisation
            en: Localization
          variable: site
          component: chemin
      timeScope:
        variable: date
        component: value
      dataGroups:
        referentiel:
          internationalizationName:
            fr: Référentiels
            en: Repositories
          label: Référentiel
          data:
            - projet
            - site
            - date
            - espece
        qualitatif:
          internationalizationName:
            fr: Qualitatif
            en: Qualitative
          label: Données qualitatives
          data:
            - Couleur des individus
        quantitatif:
          internationalizationName:
            fr: Quantitatif
            en: Quantitative
          label: Données quantitatives
          data:
            - Nombre d'individus
    uniqueness:
      - variable: projet
        component: value
      - variable: site
        component: chemin
      - variable: site
        component: plateforme
      - variable: date
        component: value
      - variable: espece
        component: value
  test:
    tags: [__hidden__]
    internationalizationName:
      fr: Test
      en: Test
    data:
      projet:
        tags: [test]
        components:
          value:
            tags: [test]
            checker:
              name: Reference
              params:
                refType: projet
    format:
      headerLine: 4
      firstRowLine: 5
      columns:
        - header: projet
          boundTo:
            variable: projet
            component: value
    authorization:
      authorizationScopes:
        projet:
          internationalizationName:
            fr: Projet
            en: Project
          variable: projet
          component: value
