OA_version: 2.0.1
OA_application:
  OA_name: progressive
  OA_version: 1
OA_data:
  agroecosystem:
    OA_naturalKey: [ nom ]
    OA_basicComponents:
      nom:
  sites:
    OA_naturalKey: [ site ]
    OA_basicComponents:
      agroecosystem:
      site:
  parcelles:
    OA_naturalKey: [ site, parcelle ]
    OA_basicComponents:
      site:
      parcelle:
  date_de_visite:
    OA_naturalKey: [date, heure, agroecosysteme]
    OA_dataHeaderLine: 2
    OA_dataFirstLine: 3
    OA_basicComponents:
      date:
        OA_checker:
          OA_name: OA_date
          OA_params:
            OA_pattern: dd/MM/yyyy
      heure:
      agroecosysteme:
        OA_checker:
          OA_name: OA_reference
          OA_params:
            OA_reference:
              OA_name: agroecosystem
    OA_computedComponents:
      relevant_number:
        OA_computation:
          OA_expression: "1"
    OA_authorizations:
      OA_authorizationScope:
        - agroecosysteme
      OA_timeScope: date