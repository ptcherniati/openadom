      tel_value :
        OA_patternForComponents: "(.*)_S2_(.*)_(.*)"
        OA_required: false
        OA_exportHeader:
          OA_title:
            fr: "valeur"
            en: "value"
          OA_description:
            fr: "valeur"
            en: "value"
        OA_componentQualifiers:
          - tel_value_variable: #$1
              OA_exportHeader:
                OA_title:
                  fr: "variable fr"
                  en: "variable en"
                OA_description:
                  fr: "variable fr"
                  en: "variable en"
          - tel_value_qualifier: #$2
              OA_exportHeader:
                OA_title:
                  fr: "qualificatif fr"
                  en: "qualifier en"
                OA_description:
                  fr: "qualificatif fr"
                  en: "qualifier en"
          - tel_value_resolution: #$3
              OA_exportHeader:
                OA_title:
