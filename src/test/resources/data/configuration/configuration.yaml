        OA_required: true
        OA_checker:
          OA_name: OA_reference
          OA_params:
            OA_reference:
              OA_name: unites
    OA_computedComponents:
      site_bassin:
        OA_tags: [ __HIDDEN__ ]
        OA_computation:
          OA_expression: >
            return references.sites
            .find{it.getNaturalKey().equals((String)datum.site.bassin)}
            .getHierarchicalKey();
          OA_references:
            - sites
        OA_checker:
          OA_name: OA_reference
          OA_params:
            OA_reference:
              OA_name: sites
    OA_validations:
      unitOfColor:
        OA_i18n:
          fr: vérifie l'unité de la couleur des individus
        OA_checker:
          OA_name: OA_groovyExpression
          OA_params:
            OA_groovy:
              OA_expression: >
                String datatype = "piegeage_en_montee"; 
                String variable = "Couleur des individus"; 
                String codeVariable = "couleur_des_individus"; 
                String component = "unit"; 
                return
                referencesValues.site_theme_datatype
                .findAll{it.datatype.equals(datatype)}
                .find{it.variable.equals(codeVariable)}
                .unite.equals((String)datum.variable.component)
              OA_references:
                - variables_et_unites_par_types_de_donnees
      unitOfIndividus:
        OA_i18n:
          fr: vérifie l'unité du nombre d'individus
        OA_required: true
        OA_checker:
          OA_name: OA_groovyExpression
          OA_params:
            OA_groovy:
              OA_expression: >
                String datatype = "piegeage_en_montee"; 
                String variable = "Nombre d'individus"; 
                String codeVariable = "nombre_d_individus"; String component = "unit"; 
                return referencesValues.get("variables_et_unites_par_types_de_donnees")
                .findAll{it.get("nom du type de données").equals(datatype)}
                .find{it.get("nom de la variable").equals(codeVariable)}
                .get("nom de l'unité").equals((String)datum.variable.component);
              OA_references:
                - variables_et_unites_par_types_de_donnees
    OA_submission:
      OA_strategy: OA_VERSIONING
      OA_fileName:
        OA_filePattern: "(.*)_(.*)_(.*)_(.*).csv"
        OA_matchPatternScopes:
          - projet
          - site_bassin
          - __START_DATE__  #optional
          - __END_DATE__  #optional
      OA_submissionScope:
