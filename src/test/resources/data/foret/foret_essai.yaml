dataTypes:
  ts_infraj:
    internationalizationName:
      fr: Température infra-journalière
      en: Infra-daily temperature
    repository:
      filePattern:
    authorization:
      authorizationScopes:
        localization:
          variable: localization
          component: zones_etudes
      timeScope:
        variable: date
        component: datetime
      dataGroups:
        informations:
          label: "Informations"
          data:
          - informations
        referentiel:
          label: "Référentiel"
          data:
            - localization
        date:
          label: "date"
          data:
            - date
        TS:
          label: TS
          data:
            - TS
    data:
      localization:
        components:
          zones_etudes_parent:
            checker:
              name: Reference
              params:
                transformation:
                  codify: true
                refType: zones_etudes
                required: false
          zones_etudes:
            checker:
              name: Reference
              params:
                transformation:
                  groovy:
                    expression: >
                      String parent = (String)datum.localization.zones_etudes_parent;
                      String nom = (String)datum.localization.zones_etudes;
                      String hierarchicalKey = ""; 
                      if ("".equals(nom)){
                        hierarchicalKey = fr.inra.oresing.persistence.Ltree.escapeToLabel(parent);
                      }else{
                        parent = fr.inra.oresing.persistence.Ltree.escapeToLabel(parent)
                        nom = fr.inra.oresing.persistence.Ltree.escapeToLabel(nom)
                        hierarchicalKey = String.format("%s.%s__%s", parent, parent, nom)
                      }
                      
                      return references
                      .find{it.key.equals("zones_etudes")}.value
                      .find {it.hierarchicalKey.equals(hierarchicalKey)} .hierarchicalKey
                    references:
                      - zones_etudes
                  codify: true
                refType: zones_etudes
                required: true
      informations:
        components:
          thematic:
            defaultValue:
              expression: return "climat du sol"
            checker:
              name: Reference
              params:
                refType: themes
                transformation:
                  codify: true
          frequency:
            checker:
              name: String
              params:
                pattern: infrajournalier
                required: true
                transformation:
                  codify: true
          start date: null
          end date: null
          comment: null
          profondeur max:
            checker:
              name: Float
              params:
                required: true
          nombre de repetition max:
            checker:
              name: Integer
              params:
                required: true
      date:
        components:
          day:
            checker:
              name: Date
              params:
                pattern: dd/MM/yyyy
          time:
            checker:
              name: Date
              params:
                pattern: HH:mm
          datetime:
            defaultValue:
              expression: >
                return (String)datum.date.day +" " +(String)datum.date.time+ ":00"
            checker:
              name: Date
              params:
                pattern: "dd/MM/yyyy HH:mm:ss"
                duration: "1 MINUTES"
      TS:
        chartDescription:
          value: value
          aggregation:
            variable: TS
            component: profondeur
          unit: "unit"
          gap: '1 WEEK'
        components:
          variable:
            checker:
              name: Reference
              params:
                refType: variables
                required: true
                transformation:
                  codify: true
          value:
            checker:
              name: Float
              params:
                required: false
          unit:
            defaultValue:
              expression: return "degre celcius"
            checker:
              name: Reference
              params:
                refType: unites
                required: true
