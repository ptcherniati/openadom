OA_version: 2.0.1
OA_application:
  OA_defaultLanguage: fr
  OA_i18n:
    OA_title:
      fr: Colonnes repétées
      en: repeatedOA_basicComponents
    OA_description:
      fr: Colonnes repétées
      en: repeatedOA_basicComponents
  OA_comment: Fichier de test de l'application repeatedOA_basicComponents
  OA_name: repeatedcolumns
  OA_version: 3.0.1
OA_data:
  agroecosystemes :
    OA_naturalKey: [agroecosystem_key]
    OA_basicComponents:
      agroecosystem_key:
        OA_importHeader: Agroécosystème_key
      agroecosystem_fr:
        OA_importHeader: Agroécosystème_fr
      agroecosystem_en:
        OA_importHeader: Agroécosystème_en
      region:
      departement:
        OA_importHeader: Département
  sites: #"nom du sites_en", "nom du sites_key", "nom du sites_fr"
    OA_validations:
      agroecosystemRef:
        OA_i18n:
          fr: "référence à l'agroécosystème"
        OA_checker:
          OA_name: OA_reference
          OA_params:
            OA_reference:
              OA_name: agroecosystemes
        OA_components: [ agroecosystem ]
      checkDateMiseEnService:
        OA_i18n:
          fr: "validation de date"
        OA_checker:
          OA_name: OA_date
          OA_params:
            OA_pattern : "dd/MM/yyyy"
        OA_components: [ "date_mise_en_service" ]
    OA_i18n:
      OA_title:
        fr: sites
        en: sites
      OA_description:
        fr: sites
        en: sites
    OA_i18nDisplayPattern:
      OA_title:
        fr: "{sites_fr}"
        en: "{sites_en}"
    OA_naturalKey: [sites_key]
    OA_basicComponents:
      agroecosystem:
        OA_importHeader: Agroécosystème
      sites_key:
        OA_importHeader: nom du site_key
      sites_fr:
        OA_importHeader: nom du site_fr
      sites_en:
        OA_importHeader: nom du site_en
      ville:
      adresse:
      coordonees:
        OA_importHeader: cordonnées du dispositif
      milieu:
      climat:
      pluviometrie:
        OA_importHeader: pluviométrie moyenne (mm)
      temperature:
        OA_importHeader: température moyenne (°C)
      vent_dominant:
        OA_importHeader: vent dominant
      vitesse_vent:
        OA_importHeader: vitesse moyenne du vent (km/h)
      type_sol:
        OA_importHeader: type de sol
      profondeur_moyenne:
        OA_importHeader: profondeur moyenne du sol (m)
      altitude_moyenne:
        OA_importHeader: altitude moyenne (m)
      date_mise_en_service:
        OA_importHeader: date mise en service du dispositif
  proprietes_taxon:
    OA_dataHeaderLine: 1
    OA_dataFirstLine: 2
    OA_validations:
      reference:
        OA_i18n:
          fr: les reference
        OA_components: [sites]
        OA_required: false
        OA_checker:
          OA_name: OA_reference
          OA_params:
            OA_reference:
              OA_name: sites
              OA_isParent: true
      floats:
        OA_i18n:
          fr: les décimaux
        OA_components: [ isFloatValue ]
        OA_checker:
          OA_name: OA_float
      integer:
        OA_i18n:
          fr: les entiers
        OA_components: [ ordre_affichage ]
        OA_checker:
          OA_name: OA_integer
    OA_i18n:
      OA_title:
        fr: Proprétés de Taxon
        en: Properties of Taxa
      OA_description:
        fr: Proprétés de Taxon
        en: Properties of Taxa
    OA_i18nDisplayPattern:
      OA_title:
        fr: "{propriete_fr}"
        en: "{propriete_en}"
      OA_description:
        fr: "{definition_fr}"
        en: "{definition_en}"
    OA_naturalKey: [propriete_key]
    OA_basicComponents:
      date:
        OA_importHeader: Date
        OA_required: true
        OA_checker:
          OA_name: OA_date
          OA_params:
            OA_pattern: dd/MM/yyyy
      propriete_key:
        OA_importHeader:  nom de la propriété_key
      propriete_fr:
        OA_importHeader: nom de la propriété_fr
      propriete_en:
        OA_importHeader: nom de la propriété_en
      definition_fr:
        OA_importHeader: définition_fr
      definition_en:
        OA_importHeader: définition_en
      isFloatValue:
        OA_importHeader: isFloatValue
      isQualitative:
        OA_importHeader: isQualitative
      type_associe:
        OA_importHeader: type associé
      ordre_affichage:
        OA_importHeader: ordre d'affichage
      sites:
  parcelles:
    OA_naturalKey: [sites,parcelle_key]
    OA_basicComponents:
      sites:
      bloc:
      repetition:
        OA_importHeader: répétition
      parcelle_key:
        OA_importHeader: nom de la parcelle_key
      parcelle_fr:
        OA_importHeader: nom de la parcelle_fr
      parcelle_en:
        OA_importHeader: nom de la parcelle_en
      surface:
      date_creation:
        OA_importHeader: date de création
      commentaire_fr:
      commentaire_en:
  blocs:
    OA_validations:
      creationDate:
        OA_i18n:
          fr: "date de création"
        OA_checker:
          OA_name: OA_date
          OA_params:
            OA_pattern: dd/MM/yyyy
        OA_components: [ date_creation ]
    OA_naturalKey: [sites,nom_du_bloc,repetition]
    OA_basicComponents:
      sites:
      nom_du_bloc:
      repetition:
        OA_importHeader: répétition
      date_creation:
        OA_importHeader: date creation
  unites:
    OA_naturalKey: [nom_key]
    OA_basicComponents:
      code_key:
      code_fr:
      code_en:
      nom_key:
      nom_fr:
      nom_en:
  modalites:
    OA_i18nDisplayPattern:
      OA_title:
        fr: '{nom_fr} ({code})'
        en: '{nom_fr} ({code})'
    OA_naturalKey: [code]
    OA_basicComponents:
      variable_forcage:
        OA_importHeader: Variable de forcage
      code:
      nom_fr:
      nom_en:
      description_fr:
      description_en:
  version_de_traitement:
    OA_naturalKey: [sites, traitement]
    OA_i18nDisplayPattern:
      OA_title:
        fr: '{traitement} ({modalites})'
        en: '{traitement} ({modalites})'
    OA_basicComponents:
      sites:
      traitement:
      version:
      date_debut:
        OA_importHeader: date début
        OA_required: true
        OA_checker:
          OA_name: OA_date
          OA_params:
            OA_pattern: dd/MM/yyyy
      date_fin:
        OA_importHeader: date fin
        OA_required: false
        OA_checker:
          OA_name: OA_date
          OA_params:
            OA_pattern: dd/MM/yyyy
      commentaire_fr:
      commentaire_en:
      modalites:
        OA_checker:
          OA_name: OA_reference
          OA_params:
            OA_reference:
              OA_name: modalites
            OA_multiplicity: MANY
  swc:
    OA_allowUnexpectedColumns: true
    OA_dataHeaderLine: 7
    OA_dataFirstLine: 10
    OA_naturalKey:
      - chemin
      - treatment
      - datetime
    OA_basicComponents:
      chemin:
        OA_importHeader: Nom parcelle
        OA_checker:
          OA_name: OA_reference
          OA_params:
            OA_reference:
              OA_name: parcelles
      treatment:
        OA_importHeader: "Nom traitement"
      day:
        OA_importHeader: Date
        OA_checker:
          OA_name: OA_date
          OA_params:
            OA_pattern: dd/MM/yyyy
      time:
        OA_importHeader: Time
        OA_checker:
          OA_name: OA_date
          OA_params:
            OA_pattern: "HH:mm:ss"
    OA_computedComponents:
      datetime:
        OA_computation:
          OA_expression: >
            return datum.Date.day +" " +datum.Date.time
        OA_checker:
          OA_name: OA_date
          OA_params:
            OA_pattern: "dd/MM/yyyy HH:mm:ss"
            OA_duration: "30 MINUTES"
    OA_patternComponents:
      swc:
        OA_patternForComponents: "SWC_([0-9]+)_([0-9]+)"
        OA_componentQualifiers:
          - repetition:
              OA_checker:
                OA_name: OA_integer
          - profondeur:
              OA_checker:
                OA_name: OA_float
        OA_componentAdjacents:
          - valeur:
              OA_importHeaderPattern: valeur
              OA_exportHeader:
                OA_title:
                  fr: valeur
              OA_checker:
                OA_name: OA_float
          - qualite:
              OA_importHeaderPattern: qualité
              OA_exportHeader:
                OA_title:
                  fr: qualité
              OA_checker:
                OA_name: OA_float
          - unite:
            OA_defaultValue:
              OA_expression: "\"pourcentage\""
              OA_checker:
                OA_name: OA_reference
                OA_params:
                  OA_reference:
                    OA_name: unites
            OA_importHeaderPattern: unité
            OA_exportHeader:
              OA_title:
                fr: unité
    OA_validations:
      swcQualityEnumeration:
        OA_i18n:
          fr: "Si renseignée, la qualité du taux d'humidité vaut 1, 2 ou 3"
        OA_checker:
          OA_name: OA_groovyExpression
          OA_params:
            OA_groovy:
              OA_expression: "Set.of(\"\", \"0\", \"1\", \"2\").contains(datum.get(\"SWC\").get(\"qualité\"))"