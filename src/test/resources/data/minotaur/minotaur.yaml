OA_version: 2.0.1
OA_application:
  OA_name: minotaur
  OA_version: 1
  OA_defaultLanguage: en
  OA_i18n:
    OA_title:
      fr: Prototype de l'application minotaur
      en: Minotaur

OA_tags:
  localisation:
    fr: "Localisation"
    en: "Localization"
  agriculture:
    fr: "ITK"
    en: "Agriculture"
  scope:
    fr: "Porté"
    en: "Scope"
  study:
    fr: "Etude"
    en: "Study"
  soils:
    fr: "Sol"
    en: "Soil"
  metadata:
    fr: "Métadonnées"
    en: "Metadata"
  data:
    fr: "Données"
    en: "Data"
  bacteria:
    fr: "Bacterie"
    en: "Bacteria"
  fungi:
    fr: "Champignon"
    en: "Fungi"
  microfauna:
    fr: "Microfaune"
    en: "Microfauna"
  mesofauna:
    fr: "Mésofaune"
    en: "Mesofauna"
  macrofauna:
    fr: "Macrofaune"
    en: "Macrofauna"
  observation:
    fr: "Observation"
    en: "Observation"
  methodology:
    fr: "methodology"
    en: "methodologie"
  biological_data:
    fr : "Données biologique"
    en : "Biological data"
  fauna:
    fr: "Données Faune"
    en: "Fauna data"
  earthworms:
    fr: "Verre de terre"
    en: "Earthworms"

OA_data:
  site:
    OA_tags: [localisation]
    OA_i18n:
      OA_title:
        fr: Site
        en: Site name
    OA_naturalKey: [ code ]
    OA_basicComponents:
      nom:
        OA_importHeader:
          OA_headerName: "nom site"
      code:
        OA_importHeader:
          OA_headerName: "code site"
  parcelle:
    OA_naturalKey: [code]
    OA_basicComponents:
      id:
        OA_importHeader:
          OA_headerName: "id site"
      nom:
        OA_importHeader:
          OA_headerName: "nom parcelle"
      code:
        OA_importHeader:
          OA_headerName: "code parcelle"
  bloc:
    OA_naturalKey: [code]
    OA_basicComponents:
      parcelle:
        OA_importHeader:
          OA_headerName: "id parcelle"
      nom:
        OA_importHeader:
          OA_headerName: "nom bloc"
      code:
        OA_importHeader:
          OA_headerName: "code bloc"
  dataset:
    OA_dataHeaderLine: 1
    OA_dataFirstLine: 2
    OA_naturalKey: [idnvx]
    OA_basicComponents:
      idnvx:
        OA_importHeader:
          OA_headerName: "idnvx"
      nxobs:
        OA_importHeader:
          OA_headerName: "nxobs"
      valeur:
        OA_importHeader:
          OA_headerName: "valeur"
    OA_computedComponents:
      site:
        OA_required: false
        OA_computation:
          OA_expression: >
            ((String)datum.nxobs).equals("site")?((String)datum.idnvx):"";
        OA_checker:
          OA_name: OA_reference
          OA_params:
            OA_reference:
              OA_name: site
      parcelle:
        OA_required: false
        OA_computation:
          OA_expression: >
            ((String)datum.nxobs).equals("parcelle")?((String)datum.idnvx):"";
        OA_checker:
          OA_name: OA_reference
          OA_params:
            OA_reference:
              OA_name: parcelle
      bloc:
        OA_required: false
        OA_computation:
          OA_expression: >
            ((String)datum.nxobs).equals("bloc")?((String)datum.idnvx):"";
        OA_checker:
          OA_name: OA_reference
          OA_params:
            OA_reference:
              OA_name: bloc
      informations:
        OA_computation:
          OA_expression: >
            def site_val = ((String)datum.nxobs).equals("site")?((String)datum.idnvx):"";
            def parcelle_val = ((String)datum.nxobs).equals("parcelle")?((String)datum.idnvx):"";
            def bloc_val = ((String)datum.nxobs).equals("bloc")?((String)datum.idnvx):"";
            return ['site': site_val, 'parcelle': parcelle_val, 'bloc': bloc_val]