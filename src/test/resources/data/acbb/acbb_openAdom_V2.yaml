    OA_validations:
      check_CO2_value:
        OA_i18n:
          fr: vérifie l'intervale de valeurs pour le CO2
          en: check value in range for CO2
        OA_checker:
          OA_name: OA_groovyExpression
          OA_params:
            OA_groovy:
              OA_expression: >                
                String stringValue = datum.flx_co2_value;
                if(stringValue.equals("") || stringValue.equals("-9999")){
                    return true;
                } else {
                    Float value = Float.parseFloat(stringValue); 
                    Float minValue =
                            com.google.common.base.Strings.isNullOrEmpty(datum.flx_co2_min)?null:Float.parseFloat((String)datum.flx_co2_min); ; 
                    Float maxValue =
                            com.google.common.base.Strings.isNullOrEmpty(datum.flx_co2_max)?null:Float.parseFloat((String)datum.flx_co2_max); ; 
                    Boolean isValid = true; 
                    isValid = minValue==null  || minValue<value; 
                    isValid = isValid && (maxValue!=null || value<=maxValue); 
                    return isValid
                }
        OA_components:   
          - flx_co2_value
