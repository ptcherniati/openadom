                    Float maxValue =
                            com.google.common.base.Strings.isNullOrEmpty(datum.flx_fc_gf_max)?null:Float.parseFloat((String)datum.flx_fc_gf_max); ; 
                    Boolean isValid = true; 
                    isValid = minValue==null  || minValue<value; 
                    isValid = isValid && (maxValue!=null || value<=maxValue); 
                    return isValid
                }
