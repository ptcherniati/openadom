            en: "treatment"
        OA_required: true
        OA_importHeaderTarget:
          OA_rowNumber: 4
          OA_columnNumber: 2
        OA_checker:
          OA_name: OA_reference
          OA_params:
            OA_reference:
              OA_name: tr_treatment_tre
      tel_pixel_count_10m:
        OA_tags:
          - __HIDDEN__
        OA_required: true
        OA_importHeaderTarget:
          OA_rowNumber: 5
          OA_columnNumber: 2
      tel_pixel_count_20m:
        OA_tags:
          - __HIDDEN__
        OA_required: true
        OA_importHeaderTarget:
          OA_rowNumber: 6
          OA_columnNumber: 2
    OA_computedComponents:
      tel_pixel_count:
        OA_computation:
          OA_expression: >
            String StringToTest = (String)datum.tel_variable;
            if(StringToTest.indexOf("10m") == -1) {return datum.tel_pixel_count_20m;
            } else {
            return datum.tel_pixel_count_10m;
            }
        OA_exportHeader:
          OA_i18n:
            fr: "nombre de pixels"
            en: "pixel count"
        OA_tags: [ __ORDER_7__ ]
    OA_patternComponents:
