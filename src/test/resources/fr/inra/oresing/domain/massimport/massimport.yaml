        OA_tags: [ __ORDER_17__ ]
      var_std_unit_uri:
        OA_importHeader: "var_standard_unit_uri"
        OA_tags: [ __ORDER_18__ ]
    OA_computedComponents:
      var_metadata:
        OA_computation: # récupère les clés naturelles des métadonnées existantes pour chaque variable (en + de celles de ce référentiel)
          OA_expression: >
            String search_var_code = (String)datum.var_code;
            return reference.tr_var_metadata_vmet
            .findAll({it.refValues.vmet_var_code.equals(search_var_code)})
            .collect({it.naturalKey})
            .join(",");
          OA_references:
            - tr_var_metadata_vmet
        OA_required: false # toutes les variables n'ont pas des métadonnées supplémentaires à celles spécifiées dans ce référentiel
        OA_checker:
          OA_name: OA_reference
          OA_params:
            OA_multiplicity: MANY
            OA_reference:
              OA_name: tr_var_metadata_vmet
        OA_exportHeader: #optional
          OA_i18n: #optional
            fr: métadonnées supplémentaires sur la variable
            en: extra variable metadata
        OA_tags: [ __ORDER_19__ ]
