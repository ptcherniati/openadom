[plugin.grafana-image-renderer]
# Répertoire où stocker les images rendues
rendering_dir = /var/lib/grafana/rendering
# URL du service de rendu d'images
rendering_server_url = http://renderer:8081/render
# Mode de rendu (png, jpg, pdf, etc.)
rendering_mode = png
# Largeur et hauteur des images rendues
rendering_viewport_width = 1000
rendering_viewport_height = 500