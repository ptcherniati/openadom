#Configuration for development mode
#Need to be overridden in final bundle
spring.config.import=optional:file:.env-default[.properties],optional:file:.env[.properties]
server.port=${SERVER_PORT}
server.servlet-path=${SERVER_SERVLET-PATH}}
allowed.origin=${ALLOWED_ORIGIN:http://localhost:8080}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.server-url=${SWAGGER-UI-URI:${allowed.origin}}
springdoc.swagger-ui.disable-swagger-default-url=true
# default JDBC URL with PG server-side prepared-statement cache enabled.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST_PORT}/${DB_DATABASE}?preparedStatementCacheQueries=256&preparedStatementCacheSizeMiB=5}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
#logging.level.org.springframework.jdbc=TRACE
# --- HTTP Hikari pool ( default , used everywhere ) ---
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION-TIMEOUT:10000}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM-IDLE:10}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM-POOL-SIZE:30}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_HIKARI_IDLE-TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX-LIFETIME:1800000}
spring.datasource.hikari.keepalive-time=${SPRING_DATASOURCE_HIKARI_KEEPALIVE-TIME:60000}
spring.datasource.hikari.validation-timeout=${SPRING_DATASOURCE_HIKARI_VALIDATION-TIMEOUT:5000}
spring.datasource.hikari.leak-detection-threshold=${OPENADOM_DB_POOL_LEAK_DETECTION:30000}
spring.datasource.hikari.auto-commit=${SPRING_DATASOURCE_HIKARI_AUTO-COMMIT:true}

# --- Streaming Hikari pool ( isolated from main , used only by ZIP/CSV/charte downloads ) ---
# Reuse the same JDBC URL / credentials as the main pool : the streaming
# pool is purely a Hikari tuning split , both pools target the exact
# same Postgres database . Property references ( ${spring.datasource.*} )
# guarantee that whatever URL is wired into the main pool ( JDBC TC in
# tests , real cluster in prod ) is reused as-is .
spring.datasource.streaming.url=${spring.datasource.url}
spring.datasource.streaming.username=${spring.datasource.username}
spring.datasource.streaming.password=${spring.datasource.password}
spring.datasource.streaming.driver-class-name=${spring.datasource.driver-class-name:org.postgresql.Driver}
spring.datasource.streaming.hikari.pool-name=streamingPool
spring.datasource.streaming.hikari.maximum-pool-size=${SPRING_DATASOURCE_STREAMING_HIKARI_MAXIMUM-POOL-SIZE:10}
spring.datasource.streaming.hikari.minimum-idle=2
spring.datasource.streaming.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION-TIMEOUT:10000}
spring.datasource.streaming.hikari.idle-timeout=300000
spring.datasource.streaming.hikari.max-lifetime=21600000
spring.datasource.streaming.hikari.keepalive-time=60000
spring.datasource.streaming.hikari.leak-detection-threshold=0
spring.datasource.streaming.hikari.auto-commit=true
# Long statement timeout for legitimate huge exports . idle_in_transaction
# also raised since cursors stay open for the whole HTTP transfer .
spring.datasource.streaming.hikari.connection-init-sql=SET statement_timeout='6h'; SET idle_in_transaction_session_timeout='6h'

# Timeout des requêtes HTTP async ( StreamingResponseBody , Callable ,
# DeferredResult ) . Format Spring Duration : 6h , 30m , 45s , PT6H .
# Sans config , Tomcat applique son default ( 30-90 s ) qui interrompt
# les exports ZIP / CSV streaming sur gros volumes . 6h couvre les
# requêtes Postgres pures de plusieurs heures sur grosses bases ; à
# ajuster selon volumétrie réelle .
openadom.http.streaming.timeout=${OPENADOM_HTTP_STREAMING_TIMEOUT:6h}

# Pre-load referencevalue + indexes into PostgreSQL shared_buffers at boot
# via the pg_prewarm extension . Removes the ~96 s cold-cache IO penalty on
# the first DataRepository.getDataIdPerKeys call after a backend restart .
# Disable in memory-constrained environments or on databases where the
# random-user role lacks privilege to install pg_prewarm . The service
# already degrades gracefully ( warn + skip ) when the extension is absent
# or the schema enumeration fails .
openadom.pg-prewarm.enabled=${OPENADOM_PG_PREWARM_ENABLED:true}

filesender.baseurl=${FILE_SENDER_BASE_URL}
filesender.username=${FILE_SENDER_USER_NAME}
filesender.apikey=${FILE_SENDER_API_KEY}
management.endpoint.health.enabled=${MANAGEMENT_ENDPOINT_HEALTH_ENABLED}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINT_WEB_EXPOSURE_INCLUDE}
management.info.env.enabled=true
management.info.build.enabled=true
management.info.git.enabled=true
# default OFF. SMTP probe to smtp.inrae.fr fails on non-INRAE
# networks and pins one Tomcat thread per 35 s probe ; opt-in only.
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
management.health.db.enabled=true
management.health.ping.enabled=true
management.health.diskspace.enabled=true
management.endpoint.health.show-components=always
management.endpoint.health.show-details=always
info.application.name=openADOM Application
info.application.description=This is the openAdom application
info.application.version=2.0.1
info.spring.version=3.3.3
info.postgresql.version=${POSTGRES_VERSION}
spring.flyway.locations=classpath:migration/main
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.placeholders.publicRoleId=${SPRING_FLYWAY_PLACEHOLDERS_PUBLIC-ROLE-ID}
# Pour application.properties
#spring.flyway.logging=DEBUG
#logging.level.org.flywaydb=DEBUG
#logging.level.org.springframework.jdbc=TRACE
logging.level.fr.inra.oresing=DEBUG
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAXFILESIZE:1MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAXREQUESTSIZE:1MB}
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=${SPRING_SERVLET_ENCODING_FORCE}
viewStrategy=${VIEW_STRATEGY}
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.test-connection=${SPRING_MAIL_TEST-CONNECTION}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTSSL_ENABLE}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTSSL_REQUIRED}
spring.mail.from=${MAIL_FROM:openadom@inrae.fr}

# Timeouts SMTP ( ms ) - bornent la duree de chaque tentative d'envoi .
# Configurables via OPENADOM_MAIL_SEND_TIMEOUT_MS . Default 3000 ms = 3s .
# EmailService.sendOrThrow declenche un retry immediat sur echec / timeout
# ( max 2 tentatives = 6s worst case ) , puis renvoie 503 et toast rouge
# cote frontend si les 2 tentatives echouent .
spring.mail.properties.mail.smtp.connectiontimeout=${OPENADOM_MAIL_SEND_TIMEOUT_MS:3000}
spring.mail.properties.mail.smtp.timeout=${OPENADOM_MAIL_SEND_TIMEOUT_MS:3000}
spring.mail.properties.mail.smtp.writetimeout=${OPENADOM_MAIL_SEND_TIMEOUT_MS:3000}

# URL publique du frontend OpenADOM, utilisée pour construire des liens absolus
# dans les emails sortants (ex. notification envoyée aux gestionnaires lors du
# dépôt d'une demande de droits).
openadom.front.base-url=${OPENADOM_FRONT_BASE_URL:http://localhost}

# =============================================================================
# Auth - durée de validité des clés de validation ( en minutes )
# =============================================================================
# Applique à TOUS les flows utilisant une clé de validation par email :
#   - activation de compte ( idle -> active )
#   - mot de passe oublié ( reset )
#   - changement d'email ( ecrasement direct email <- nouvel email )
# Au-delà , la clé est rejetée même si bien formée ( BAD_VALIDATION_KEY ) et
# l'utilisateur doit relancer le flow pour recevoir une nouvelle clé .
# Default 10 min : compromis entre sécurité ( fenêtre courte ) et UX
# ( délais postaux courants des MTA + check spam ) .
openadom.auth.validation-key-ttl-minutes=${OPENADOM_AUTH_VALIDATION_KEY_TTL_MINUTES:10}

# =============================================================================
# Caches mémoire ( un flag par cache, granularité explicite )
# =============================================================================
# Convention de nommage : openadom.cache.<nom-du-cache>.enabled / ttl-minutes
# Chaque cache est indépendant : activer / désactiver l'un n'impacte pas les
# autres. À l'avenir, ajouter un nouveau cache = ajouter une paire de propriétés
# dédiée plutôt que d'élargir les flags existants.
#
# Cache des listes de filtres ( cf. DataService.filterListCache )
#    Stocke le JSON déjà sérialisé des dropdowns de filtres ( endpoint
#    /filters ) par couple ( application , refType ). Le 1er calcul peut
#    prendre &gt; 50 s sur gros datasets ; le hit cache renvoie en &lt; 1 ms.
#    L'invalidation est déclenchée après chaque dépôt / suppression de données.
openadom.cache.filter-list.enabled=${OPENADOM_CACHE_FILTER_LIST_ENABLED:true}
# Capacité max ( nombre d'entrées ) du cache filterList. LRU eviction au-delà.
openadom.cache.filter-list.max-entries=${OPENADOM_CACHE_FILTER_LIST_MAX_ENTRIES:50}

# Rate limit sliding-window pour l'endpoint /filters ( anti-spam par
# utilisateur ) . Empeche un user de saturer le pool Hikari + CPU
# backend en multipliant les appels avec refType differents . Le
# singleflight pattern dans DataService.getFilterListResult dedup les
# requetes pour la MEME cle ; ce rate limit gere le spam multi-cle .
# max-per-window=0 ( ou negatif ) desactive le rate limit .
openadom.ratelimit.filters.max-per-window=${OPENADOM_RATELIMIT_FILTERS_MAX_PER_WINDOW:30}
openadom.ratelimit.filters.window-seconds=${OPENADOM_RATELIMIT_FILTERS_WINDOW_SECONDS:60}

# Cache des authorization scopes ( cf. AuthorizationService.scopesCache )
#    Stocke l'arbre des permissions retourné par la fonction SQL
#    &lt;schema&gt;.getnodes(menuType) , appelée par /data/json à chaque clic.
#    Walk récursif sur referencevalue ( 4.3M rows sur si_acbb ) -&gt; ~5 s par
#    miss ; hit cache &lt; 1 ms. Invalidé sur import / delete data ( hook dans
#    refreshFilterListCache + invalidateFilterListCache ) , filet TTL 5 min.
#    Clé inclut userId pour respecter le filtrage RLS par rôle Postgres.
openadom.cache.authorization-scopes.enabled=${OPENADOM_CACHE_AUTHORIZATION_SCOPES_ENABLED:true}
# Capacité max ( nombre d'entrées ) du cache scopes. LRU eviction au-delà.
openadom.cache.authorization-scopes.max-entries=${OPENADOM_CACHE_AUTHORIZATION_SCOPES_MAX_ENTRIES:200}
# TTL en minutes. Si &lt;= 0 : pas de TTL automatique , invalidation uniquement
# par les hooks d'écriture ( import / delete / YAML edit ). Sinon : filet
# anti-stale en cas de hook oublié.
openadom.cache.authorization-scopes.ttl-minutes=${OPENADOM_CACHE_AUTHORIZATION_SCOPES_TTL_MINUTES:120}

# Cache des CheckedFormatComponents ( cf. DataService.checkedFormatComponentsCache )
#    Stocke le résultat de CheckerFactory.getCheckers ( filtre + group by
#    type ) appelé par /data/json à chaque clic. ~600 ms par miss sur des
#    datatypes riches en colonnes ( ReferenceChecker préchargent leurs
#    valeurs distinctes ). Hit cache &lt; 1 ms. Clé ( appName , dataName ) ;
#    pas d'userId puisque le résultat est purement déclaratif. Invalidé sur
#    import / delete data , filet TTL 5 min , borne LRU 200 entrées.
openadom.cache.checked-format-components.enabled=${OPENADOM_CACHE_CHECKED_FORMAT_COMPONENTS_ENABLED:true}
# Capacité max ( nombre d'entrées ) du cache checkedFormatComponents.
openadom.cache.checked-format-components.max-entries=${OPENADOM_CACHE_CHECKED_FORMAT_COMPONENTS_MAX_ENTRIES:200}
# TTL en minutes. Même sémantique que authorization-scopes.ttl-minutes :
# &lt;= 0 = pas de TTL ( invalidation uniquement par les hooks d'écriture ).
openadom.cache.checked-format-components.ttl-minutes=${OPENADOM_CACHE_CHECKED_FORMAT_COMPONENTS_TTL_MINUTES:120}

# Cache des liaisons binaryfile <-> binaryfile ( cf. BinaryFileService.referencedFilesCache )
#    Stocke par binaryfile la liste des autres binaryfiles auxquels il est lie
#    via reference_reference / referencevalue ( utilise par isLinked() cote front
#    pour afficher l'icone de liaison ) . Query SQL sous-jacente couteuse :
#    3-5 s sur si_acbb ( JOIN sur referencevalue 9.9M rows + reference_reference
#    13M rows ) , linaire au volume de data ; le cache evite la requete sur les
#    toggles publish/depublie successifs. Cle ( applicationId , dataType ,
#    singleFileId ) - granularite fine pour qu'un toggle ne flush qu'1 entree.
#    Pas de dimension user : la donnee est purement structurelle ( relations
#    data ) , independante du role appelant.
openadom.cache.referenced-files.enabled=${OPENADOM_CACHE_REFERENCED_FILES_ENABLED:true}
# Capacite max ( nombre d'entrees ) du cache referencedFiles. LRU eviction au-dela.
openadom.cache.referenced-files.max-entries=${OPENADOM_CACHE_REFERENCED_FILES_MAX_ENTRIES:200}
# TTL en minutes. Si <= 0 : pas de TTL automatique , invalidation uniquement
# par les hooks d'ecriture ( VersioningService.createData -> mutation
# referencevalue / reference_reference ). Sinon : filet anti-stale en cas de
# hook oublie. Defaut 30 min ( cohrent avec un workflow de publication ).
openadom.cache.referenced-files.ttl-minutes=${OPENADOM_CACHE_REFERENCED_FILES_TTL_MINUTES:30}

# Bornes du cache ETag JS-side ( EtagCache.ts , côté frontend ).
# Exposées au front via GET /session/config -&gt; SessionService applique au
# boot de l'app. Permet de tuner sans rebuilder le bundle.
#   max-entries  : nombre max d'entrées avant LRU eviction.
#   max-bytes-mb : plafond mémoire heap browser ( hard cap ).
openadom.cache.front.etag.max-entries=${OPENADOM_CACHE_FRONT_ETAG_MAX_ENTRIES:50}
openadom.cache.front.etag.max-bytes-mb=${OPENADOM_CACHE_FRONT_ETAG_MAX_BYTES_MB:20}

# =============================================================================
# Compteur de lignes par référencetype ( synthesis sur la page "Données" )
# =============================================================================
# Mode "table de stats" ( défaut ) : DataRepository.buildReferenceSynthesis
# lit la table <schema>.referencevalue_count_stats maintenue par 2 triggers
# AFTER INSERT/DELETE statement-level sur referencevalue ( cf. migration
# Flyway application/V5 ). Lookup PRIMARY KEY &lt;1ms quel que soit le volume
# source ( cible ACBB : 200M rows ).
#
# Mode "COUNT direct" ( false ) : SELECT count(*) GROUP BY referencetype
# sur la table source à chaque appel. Mode dégradé conservé pour debug
# / benchmark ; ~12 s sur 10M rows actuels , 2-5 min sur 200M rows.
#
# Le frontend affiche le mode actif dans l'onglet "Gestion de l'application"
# à côté du bouton "Recompute exact" ( visible uniquement si true ).
# Le flag est exposé via GET /api/v1/session/config.
openadom.referencevalue.count.use-stats-table=${OPENADOM_REFERENCEVALUE_COUNT_USE_STATS_TABLE:true}

# =============================================================================
# Bundle upload ( endpoint GET /applications/{name}/upload-bundle )
# =============================================================================
# Construit un ZIP contenant toutes les données ( ou squelettes ) des
# datatypes d'une application puis l'upload sur FileSender Renater pour
# générer un lien partagé envoyé par mail au demandeur.
#
# Nombre de datatypes / référentiels traités EN PARALLÈLE pendant la
# construction du ZIP ( cf. DataService.writeUploadBundle ). Chaque
# traitement consomme 1 connexion Hikari ( pool main ) + 1 thread +
# mémoire pour le streaming CSV ; sans cette borne, le bundle d'une
# application avec N datatypes saturerait le pool DB et le heap.
# Défaut : 6. À monter ( ex. 10 ) si le pool main Hikari est large et la
# RAM conteneur généreuse ; à descendre ( ex. 3 ) sur petit hôte.
openadom.bundle.upload.parallelism=${OPENADOM_BUNDLE_UPLOAD_PARALLELISM:6}

fr.inra.oresing.charte.default=classpath:charte/default_charte.pdf
#
#spring.mvc.problemdetails.enabled=true
#logging.level.org.springframework.security=TRACE
#spring.reactor.context-propagation=auto
spring.security.strategy=MODE_INHERITABLETHREADLOCAL
spring.threads.virtual.enabled=${SPRING_THREADS_VIRTUAL_ENABLED:false}

# PERF #58 - Compression gzip des réponses HTTP volumineuses ( ex : filtres ~1.7 MB -> ~200 KB )
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/x-ndjson,text/plain

spring.task.execution.pool.max-size=${POOL_MAX_SIZE:16}
spring.task.execution.pool.queue-capacity=${POOL_QUEUE_CAPACITY:100}
spring.task.execution.pool.keep-alive=${POOL_KEEP_ALIVE:10s}
spring.task.execution.thread-name-prefix=${POOL_THREAD_PREFIX:openadom-exec-}

#######################################################################
# Pipeline d'import CSV ( cascade ) - issue #62                       #
#                                                                     #
# Defauts portes par fr.inra.oresing.workflow.cascade.config.ImportProperties .
# Surchargeables au runtime via les env vars CASCADE_IMPORT_* exposees#
# dans local_deployment/backend/compose.yml ( elle-meme nourrie par   #
# local_deployment/.env ).                                            #
#######################################################################
cascade.import.chunk-size-lines=${CASCADE_IMPORT_CHUNK_SIZE_LINES:1000}
cascade.import.parallelism=${CASCADE_IMPORT_PARALLELISM:4}
cascade.import.progress-batch-size=${CASCADE_IMPORT_PROGRESS_BATCH_SIZE:100}
cascade.import.max-errors-threshold=${CASCADE_IMPORT_MAX_ERRORS_THRESHOLD:100}
cascade.import.chunks-temp-dir=${CASCADE_IMPORT_CHUNKS_TEMP_DIR:/tmp/openadom-import/chunks}
cascade.import.processed-temp-dir=${CASCADE_IMPORT_PROCESSED_TEMP_DIR:/tmp/openadom-import/processed}
cascade.import.max-concurrent-per-user=${CASCADE_IMPORT_MAX_CONCURRENT_PER_USER:3}
cascade.import.collector-chunk-size=${CASCADE_IMPORT_COLLECTOR_CHUNK_SIZE:0}
cascade.import.enable-metrics=${CASCADE_IMPORT_ENABLE_METRICS:false}
# Plafonds mémoire des caches d'import ( stratégie lazy : seules les valeurs
# vues >= 2 fois sont mises en cache ).
# Cache ReferenceType.precomputedResults (lookup référentiel O(1)).
cascade.import.reference-cache-max-entries=${CASCADE_IMPORT_REFERENCE_CACHE_MAX_ENTRIES:5000}

#######################################################################
# cascade 2.1.0 : pipeline mode + sink strategy ( bench-platform flags )
#######################################################################
# Sink strategy ( MERGE_FILE = legacy , DIRECT_COPY = new staging-based )
cascade.import.sink-strategy=${CASCADE_IMPORT_SINK_STRATEGY:MERGE_FILE}

# Cascade pipeline mode ( STAGED = transform stage barrier before sink stage ;
# PIPELINED = transform/sink overlap via bounded queue ) . See cascade 2.1.0
# PipelineMode javadoc for the migration mapping from cascade 2.0 axes .
cascade.import.pipeline-mode=${CASCADE_IMPORT_PIPELINE_MODE:STAGED}

# Staging strategy under DIRECT_COPY .
#  - PER_CONNECTION_TEMP : sticky single connection , 1 sink serial , atomic
#    via TEMP table . Recommande pour tests / dev . NON RECUPERABLE en cas
#    de SIGKILL ( la TEMP meurt avec la connexion , aucune trace en base ) .
#  - SHARED_UNLOGGED ( defaut prod ) : table UNLOGGED permanente partagee
#    avec tag correlation_id . Workers paralleles . Survit au crash JVM
#    -> rows recuperables via IntegrityService.reprocess et sweeper orphan .
#  - PER_WORKFLOW_TABLE : 1 table UNLOGGED dediee par workflow , isolation
#    native , DROP atomique . Survit au crash JVM .
cascade.import.staging-strategy=${CASCADE_IMPORT_STAGING_STRATEGY:SHARED_UNLOGGED}

# Shared UNLOGGED staging table name ( must exist via Flyway migration ; schema-qualified )
cascade.import.staging-shared-table-name=${CASCADE_IMPORT_STAGING_SHARED_TABLE_NAME:oa_staging.referencevalue_import_shared}

# P1-3 : intra-import natural-key duplicate detection ( hierarchicalKey_uniqueness )
# evaluated on the staging table before the UPSERT loop .
#  - OFF  : no scan , strictly legacy behaviour ( zero overhead ) .
#  - WARN ( default ) : one aggregate scan + detailed log ; the UPSERT then runs
#    exactly as before -> same final result , just observed .
#  - FAIL : raise a clear business error before any mutation ( replaces the opaque
#    SQLSTATE 21000 intra-batch / silent cross-batch merge ) .
cascade.import.intra-duplicate-policy=${CASCADE_IMPORT_INTRA_DUPLICATE_POLICY:WARN}

# S-5 : SET LOCAL work_mem / maintenance_work_mem for the finalize session
# ( speeds up sorts / hashes / aggregates + index/maintenance ops ) . Postgres
# memory format ( e.g. 256MB , 1GB ) . Empty = keep cluster default ( no override ) .
cascade.import.finalize-work-mem=${CASCADE_IMPORT_FINALIZE_WORK_MEM:}
cascade.import.finalize-maintenance-work-mem=${CASCADE_IMPORT_FINALIZE_MAINTENANCE_WORK_MEM:}

# Shared UNLOGGED orphan TTL minutes ( cleanup-after-crash sweep )
cascade.import.staging-shared-orphan-ttl-minutes=${CASCADE_IMPORT_STAGING_SHARED_ORPHAN_TTL_MINUTES:60}

# Skip CSV re-encoding in DataImporter.prepareContextForDataTreatment
# Risky : assumes input CSV has no multi-line cells / unescaped quotes
cascade.import.skip-csv-reencoding=${CASCADE_IMPORT_SKIP_CSV_REENCODING:false}

# Postgres SET LOCAL statement_timeout applique au debut de la finalize
# hook ( UPSERT staging -> referencevalue ) . Garde-fou contre les UPSERTs
# bloques infiniment ( deadlock pur , lock advisory non release ) que le
# heartbeat ne detecte pas ( cf P1 #4 javadoc : heartbeat = liveness probe
# pas success probe ) . Doit etre superieur au temps legitime maximal d'un
# finalize ( gros UPSERT 1M+ rows ) . 0 = pas de timeout ( deconseille
# en prod , reserve aux tests ) . Defaut : 180 min ( 3h ) .
cascade.import.finalize-statement-timeout-minutes=${CASCADE_IMPORT_FINALIZE_STATEMENT_TIMEOUT_MINUTES:180}

# =====================================================================
# Compensation log : recovery automatique des operations interrompues
# =====================================================================
# Activable / desactivable . Si false , les rows orphelines ne seront
# nettoyees que par intervention manuelle via la page admin "Integrite" .
app.compensation.sweep.enabled=${APP_COMPENSATION_SWEEP_ENABLED:true}

# Cron du sweeper ( default : 3h du matin tous les jours )
app.compensation.sweep.cron=${APP_COMPENSATION_SWEEP_CRON:0 0 3 * * *}

# TTL avant qu'une row PENDING soit consideree orpheline ( minutes ; default 4h )
app.compensation.sweep.orphan-ttl-minutes=${APP_COMPENSATION_SWEEP_ORPHAN_TTL_MINUTES:240}

# Max rows traitees par sweep run
app.compensation.sweep.batch-size=${APP_COMPENSATION_SWEEP_BATCH_SIZE:100}

# Retention des rows FAILED ( jours , 0 = jamais purger )
app.compensation.failed-retention-days=${APP_COMPENSATION_FAILED_RETENTION_DAYS:7}

# =====================================================================
# Workflow lifecycle : pre-persist IN_PROGRESS + zombie detection +
# heartbeat ( cf V4 / V5 migrations ) .
# =====================================================================
# Frequence d'emission du heartbeat pendant les phases longues
# ( finalize hook UPSERT staging -> referencevalue ) . Le thread dedie
# {@code HeartbeatService} ecrit {@code last_heartbeat_at} dans
# {@code oa_audit.workflow_log} toutes les N sec . Cost negligeable
# ( 1 UPDATE indexed par workflow actif / 30 sec ) .
app.workflow.heartbeat-interval-seconds=${APP_WORKFLOW_HEARTBEAT_INTERVAL_SECONDS:30}

# Seuil ( minutes ) au-dela duquel un workflow IN_PROGRESS sans heartbeat
# est presume mort et passe a CANCELLED par le sweeper . S'applique sur
# COALESCE ( last_heartbeat_at , start_time ) , donc :
#  - workflows avec heartbeat finalize OU cascade lifecycle : 10 min OK
#    ( marge x20 sur l'interval beat 30 sec )
#  - workflows sans heartbeat ( phase courte , pre-V5 ) : start_time
#    fallback ; relever a 30+ pour eviter faux positifs
# Bumpé 5 -> 10 en cascade 2.2.0 : la phase SOURCE/TRANSFORM est désormais
# couverte par WorkflowAliveEvent côté lib + DbHeartbeatListener côté
# openADOM , donc faux positifs quasi impossibles avant 10 min de silence
# total . Marge supplémentaire face aux pauses GC longues / pression DB .
app.workflow.zombie-threshold-minutes=${APP_WORKFLOW_ZOMBIE_THRESHOLD_MINUTES:10}

# Cron du zombie sweeper ( default : toutes les 5 min ) . UPDATE indexed
# tres leger , la frequence elevee n'est pas couteuse .
app.workflow.zombie-sweep-cron=${APP_WORKFLOW_ZOMBIE_SWEEP_CRON:0 */5 * * * *}

# Active / desactive le @Scheduled WorkflowZombieSweeper . Off : aucun
# auto-cancel des workflows IN_PROGRESS bloques ( utile en debug pour
# laisser un workflow vivre apres GC pause longue ) . En prod : true .
app.workflow.zombie-enabled=${APP_WORKFLOW_ZOMBIE_ENABLED:true}

# Destinataire email des notifications zombies UNPUBLISH / DELETE_FILE
# marques FAILED par le sweeper ( migration V12 ) . Vide ( defaut ) =
# notifications desactivees ( log warn local uniquement ) . En prod ,
# definir une boite admin pour etre alerte des operations a relancer .
app.workflow.zombie-notify-email=${APP_WORKFLOW_ZOMBIE_NOTIFY_EMAIL:}

# =====================================================================
# Heap Guard ( refuse les nouvelles publications quand JVM sous pression )
# =====================================================================
# Service @Scheduled qui surveille le heap JVM et refuse les nouvelles
# demandes publish / unpublish / delete-file ( HTTP 503 ) quand le
# pourcentage d'utilisation depasse le seuil . Evite les OOM brutaux
# en multi-publish concurrent .
#
# refuse-publish-threshold-pct : seuil ( % ) au-dela duquel toute nouvelle
# operation est refusee avec BackendOverloadedException ( retry-later ) .
# Defaut 90% : marge de 10% avant OOM , largement suffisant pour la
# plupart des deploiements .
app.workflow.heap-guard.refuse-publish-threshold-pct=${APP_WORKFLOW_HEAP_GUARD_REFUSE_PCT:90}

# critical-threshold-pct : seuil ( % ) au-dela duquel un log ERROR est
# emis a chaque tick ( pour supervision externe / alerting Prometheus ) .
# Doit etre >= refuse-publish-threshold-pct . Defaut 95% : alerte
# imminente OOM .
app.workflow.heap-guard.critical-threshold-pct=${APP_WORKFLOW_HEAP_GUARD_CRITICAL_PCT:95}

# Interval entre deux scans heap ( ms ) . Defaut 10s : suffisant pour
# detecter une montee progressive , pas assez court pour saturer .
app.workflow.heap-guard.check-interval-ms=${APP_WORKFLOW_HEAP_GUARD_INTERVAL_MS:10000}

# Active / desactive le service . Off : aucun garde-fou , les nouvelles
# publications sont acceptees jusqu'a l'OOM ( comportement legacy
# pre-2026-05 ) . En prod : true .
app.workflow.heap-guard.enabled=${APP_WORKFLOW_HEAP_GUARD_ENABLED:true}

# =====================================================================
# Cascade lifecycle heartbeat ( cascade 2.2.0 )
# =====================================================================
# Cascade emet un evenement WorkflowAliveEvent toutes les N secondes pour
# chaque workflow actif qui montre une activite cote chunk . Le bridge
# DbHeartbeatListener consomme cet evenement pour mettre a jour
# last_heartbeat_at dans oa_audit.workflow_log . Couvre les phases SOURCE /
# TRANSFORM / SINK ( ce que le HeartbeatService finalize ne couvrait pas ) .
# Si false : aucun beat cote cascade ; le sweeper retombe sur start_time
# fallback , donc un workflow long ( >10 min ) sans phase finalize sera
# faux-positif sweep si la threshold reste a 10 min .
app.workflow.cascade-heartbeat.enabled=${APP_WORKFLOW_CASCADE_HEARTBEAT_ENABLED:true}

# Periode du scheduler interne cascade ( ms ) . Defaut 30000 ms = 30 sec .
# Cost negligeable : 1 UPDATE indexe par workflow actif / N sec .
app.workflow.cascade-heartbeat.period-ms=${APP_WORKFLOW_CASCADE_HEARTBEAT_PERIOD_MS:30000}

# Quotas extraction ( cf. ExtractionRateLimiter )
cascade.extraction.max-concurrent-per-user=${CASCADE_EXTRACTION_MAX_CONCURRENT_PER_USER:5}
cascade.extraction.acquire-timeout-seconds=${CASCADE_EXTRACTION_ACQUIRE_TIMEOUT_SECONDS:0}

#######################################################################
# Cascade - pools partages + virtual threads                          #
#                                                                     #
# Cascade lit ces parametres SOIT depuis les system properties        #
# JVM ( -Dcascade.pool.source=N ) , SOIT depuis les env vars          #
# CASCADE_POOL_SOURCE=N. Spring ne les expose PAS lui-meme : elles    #
# transitent directement de l'environnement vers cascade.             #
#                                                                     #
# Variables disponibles ( vide = use cascade default = 4 threads ,    #
# queue 100 ) :                                                       #
#                                                                     #
#   CASCADE_POOL_SOURCE / TRANSFORM / SINK / ORDERING                 #
#   CASCADE_POOL_{stage}_QUEUE                                        #
#   CASCADE_VIRTUAL_THREADS                                           #
#                                                                     #
# Commentaire informatif uniquement ; les valeurs sont definies dans  #
# local_deployment/.env et propagees via local_deployment/backend/    #
# compose.yml.                                                        #
#######################################################################

#######################################################################
# Securite : duree de vie du JWT en secondes ( default 3600 = 1h ) .  #
# Override via la var d'env JWT_EXPIRATION ( cf. local_deployment ) . #
#######################################################################
jwt.expiration=${JWT_EXPIRATION:3600}

spring.data.web.pageable.serialization-mode=


