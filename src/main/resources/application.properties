#Configuration for development mode
#Need to be overridden in final bundle
spring.config.import=optional:file:.env-default[.properties],optional:file:.env[.properties]
server.port=${SERVER_PORT}
server.servlet-path=${SERVER_SERVLET-PATH}}
allowed.origin=${ALLOWED_ORIGIN:http://localhost:8080}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.server-url=${SWAGGER-UI-URI:${allowed.origin}}
springdoc.swagger-ui.disable-swagger-default-url=true
# default JDBC URL with PG server-side prepared-statement cache enabled.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST_PORT}/${DB_DATABASE}?preparedStatementCacheQueries=256&preparedStatementCacheSizeMiB=5}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
#logging.level.org.springframework.jdbc=TRACE
# --- HTTP Hikari pool ( default , used everywhere ) ---
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION-TIMEOUT:10000}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM-IDLE:10}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM-POOL-SIZE:30}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_HIKARI_IDLE-TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX-LIFETIME:1800000}
spring.datasource.hikari.keepalive-time=${SPRING_DATASOURCE_HIKARI_KEEPALIVE-TIME:60000}
spring.datasource.hikari.validation-timeout=${SPRING_DATASOURCE_HIKARI_VALIDATION-TIMEOUT:5000}
spring.datasource.hikari.leak-detection-threshold=${SPRING_DATASOURCE_HIKARI_LEAK-DETECTION-THRESHOLD:30000}
spring.datasource.hikari.auto-commit=${SPRING_DATASOURCE_HIKARI_AUTO-COMMIT:true}

filesender.baseurl=${FILE_SENDER_BASE_URL}
filesender.username=${FILE_SENDER_USER_NAME}
filesender.apikey=${FILE_SENDER_API_KEY}
management.endpoint.health.enabled=${MANAGEMENT_ENDPOINT_HEALTH_ENABLED}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINT_WEB_EXPOSURE_INCLUDE}
management.info.env.enabled=true
management.info.build.enabled=true
management.info.git.enabled=true
# default OFF. SMTP probe to smtp.inrae.fr fails on non-INRAE
# networks and pins one Tomcat thread per 35 s probe ; opt-in only.
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
management.health.db.enabled=true
management.health.ping.enabled=true
management.health.diskspace.enabled=true
management.endpoint.health.show-components=always
management.endpoint.health.show-details=always
info.application.name=openADOM Application
info.application.description=This is the openAdom application
info.application.version=2.0.1
info.spring.version=3.3.3
info.postgresql.version=${POSTGRES_VERSION}
spring.flyway.locations=classpath:migration/main
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.placeholders.publicRoleId=${SPRING_FLYWAY_PLACEHOLDERS_PUBLIC-ROLE-ID}
# Pour application.properties
#spring.flyway.logging=DEBUG
#logging.level.org.flywaydb=DEBUG
#logging.level.org.springframework.jdbc=TRACE
logging.level.fr.inra.oresing=DEBUG
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAXFILESIZE:1MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAXREQUESTSIZE:1MB}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=${SPRING_SERVLET_ENCODING_FORCE}
viewStrategy=${VIEW_STRATEGY}
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.test-connection=${SPRING_MAIL_TEST-CONNECTION}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTSSL_ENABLE}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTSSL_REQUIRED}
spring.mail.from=${MAIL_FROM}
fr.inra.oresing.charte.default=classpath:charte/default_charte.pdf
#
#spring.mvc.problemdetails.enabled=true
#logging.level.org.springframework.security=TRACE
#spring.reactor.context-propagation=auto
spring.security.strategy=MODE_INHERITABLETHREADLOCAL
spring.threads.virtual.enabled=${SPRING_THREADS_VIRTUAL_ENABLED:false}

# PERF #58 - Compression gzip des réponses HTTP volumineuses ( ex : filtres ~1.7 MB -> ~200 KB )
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/x-ndjson,text/plain

spring.task.execution.pool.max-size=${POOL_MAX_SIZE:16}
spring.task.execution.pool.queue-capacity=${POOL_QUEUE_CAPACITY:100}
spring.task.execution.pool.keep-alive=${POOL_KEEP_ALIVE:10s}
spring.task.execution.thread-name-prefix=${POOL_THREAD_PREFIX:openadom-exec-}

#######################################################################
# Pipeline d'import CSV ( cascade ) - issue #62                       #
#                                                                     #
# Defauts portes par fr.inra.oresing.workflow.cascade.config.ImportProperties .
# Surchargeables au runtime via les env vars CASCADE_IMPORT_* exposees#
# dans local_deployment/backend/compose.yml ( elle-meme nourrie par   #
# local_deployment/.env ).                                            #
#######################################################################
cascade.import.chunk-size-lines=${CASCADE_IMPORT_CHUNK_SIZE_LINES:1000}
cascade.import.parallelism=${CASCADE_IMPORT_PARALLELISM:2}
cascade.import.progress-batch-size=${CASCADE_IMPORT_PROGRESS_BATCH_SIZE:1000}
cascade.import.max-errors-threshold=${CASCADE_IMPORT_MAX_ERRORS_THRESHOLD:100}
cascade.import.chunks-temp-dir=${CASCADE_IMPORT_CHUNKS_TEMP_DIR:/tmp/openadom-import/chunks}
cascade.import.processed-temp-dir=${CASCADE_IMPORT_PROCESSED_TEMP_DIR:/tmp/openadom-import/processed}
cascade.import.max-concurrent-per-user=${CASCADE_IMPORT_MAX_CONCURRENT_PER_USER:3}
cascade.import.collector-chunk-size=${CASCADE_IMPORT_COLLECTOR_CHUNK_SIZE:0}
cascade.import.enable-metrics=${CASCADE_IMPORT_ENABLE_METRICS:false}

#######################################################################
# cascade 1.7.0 : workflow modes + sink strategy ( bench-platform flags )
#######################################################################
# Sink strategy ( MERGE_FILE = legacy , DIRECT_COPY = new staging-based )
cascade.import.sink-strategy=${CASCADE_IMPORT_SINK_STRATEGY:MERGE_FILE}

# Cascade execution mode ( SYNC = direct-write driver , ASYNC = parallel sink + fail-fast + timeout )
cascade.import.execution-mode=${CASCADE_IMPORT_EXECUTION_MODE:SYNC}

# Direct-write parallel ( only meaningful when execution-mode=SYNC )
cascade.import.direct-write-parallel=${CASCADE_IMPORT_DIRECT_WRITE_PARALLEL:false}

# Streaming mode ( BUFFERED default ; BACKPRESSURED reserved for cascade 1.7.1 )
cascade.import.streaming-mode=${CASCADE_IMPORT_STREAMING_MODE:BUFFERED}

# Staging strategy under DIRECT_COPY ( PER_CONNECTION_TEMP atomic , SHARED_UNLOGGED parallel )
cascade.import.staging-strategy=${CASCADE_IMPORT_STAGING_STRATEGY:PER_CONNECTION_TEMP}

# Shared UNLOGGED staging table name ( must exist via Flyway migration )
cascade.import.staging-shared-table-name=${CASCADE_IMPORT_STAGING_SHARED_TABLE_NAME:referencevalue_import_shared}

# Shared UNLOGGED orphan TTL minutes ( cleanup-after-crash sweep )
cascade.import.staging-shared-orphan-ttl-minutes=${CASCADE_IMPORT_STAGING_SHARED_ORPHAN_TTL_MINUTES:60}

# Skip CSV re-encoding in DataImporter.prepareContextForDataTreatment
# Risky : assumes input CSV has no multi-line cells / unescaped quotes
cascade.import.skip-csv-reencoding=${CASCADE_IMPORT_SKIP_CSV_REENCODING:false}

# Quotas extraction ( cf. ExtractionRateLimiter )
cascade.extraction.max-concurrent-per-user=${CASCADE_EXTRACTION_MAX_CONCURRENT_PER_USER:5}
cascade.extraction.acquire-timeout-seconds=${CASCADE_EXTRACTION_ACQUIRE_TIMEOUT_SECONDS:0}

#######################################################################
# Cascade - pools partages + virtual threads                          #
#                                                                     #
# Cascade lit ces parametres SOIT depuis les system properties        #
# JVM ( -Dcascade.pool.source=N ) , SOIT depuis les env vars          #
# CASCADE_POOL_SOURCE=N. Spring ne les expose PAS lui-meme : elles    #
# transitent directement de l'environnement vers cascade.             #
#                                                                     #
# Variables disponibles ( vide = use cascade default = 4 threads ,    #
# queue 100 ) :                                                       #
#                                                                     #
#   CASCADE_POOL_SOURCE / TRANSFORM / SINK / ORDERING                 #
#   CASCADE_POOL_{stage}_QUEUE                                        #
#   CASCADE_VIRTUAL_THREADS                                           #
#                                                                     #
# Commentaire informatif uniquement ; les valeurs sont definies dans  #
# local_deployment/.env et propagees via local_deployment/backend/    #
# compose.yml.                                                        #
#######################################################################

spring.data.web.pageable.serialization-mode=


