#Configuration for development mode
#Need to be overridden in final bundle
spring.config.import=optional:file:.env-default[.properties],optional:file:.env[.properties]
server.port=${SERVER_PORT}
server.servlet-path=${SERVER_SERVLET-PATH}}
allowed.origin=${ALLOWED_ORIGIN:http://localhost:8080}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.server-url=${SWAGGER-UI-URI:${allowed.origin}}
springdoc.swagger-ui.disable-swagger-default-url=true
# default JDBC URL with PG server-side prepared-statement cache enabled.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST_PORT}/${DB_DATABASE}?preparedStatementCacheQueries=256&preparedStatementCacheSizeMiB=5}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
#logging.level.org.springframework.jdbc=TRACE
# --- HTTP Hikari pool ( default , used everywhere ) ---
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION-TIMEOUT:10000}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM-IDLE:10}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM-POOL-SIZE:30}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_HIKARI_IDLE-TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX-LIFETIME:1800000}
spring.datasource.hikari.keepalive-time=${SPRING_DATASOURCE_HIKARI_KEEPALIVE-TIME:60000}
spring.datasource.hikari.validation-timeout=${SPRING_DATASOURCE_HIKARI_VALIDATION-TIMEOUT:5000}
spring.datasource.hikari.leak-detection-threshold=${OPENADOM_DB_POOL_LEAK_DETECTION:30000}
spring.datasource.hikari.auto-commit=${SPRING_DATASOURCE_HIKARI_AUTO-COMMIT:true}

# Timeout des requêtes HTTP async ( StreamingResponseBody , Callable ,
# DeferredResult ) . Format Spring Duration : 6h , 30m , 45s , PT6H .
# Sans config , Tomcat applique son default ( 30-90 s ) qui interrompt
# les exports ZIP / CSV streaming sur gros volumes . 6h couvre les
# requêtes Postgres pures de plusieurs heures sur grosses bases ; à
# ajuster selon volumétrie réelle .
openadom.http.streaming.timeout=${OPENADOM_HTTP_STREAMING_TIMEOUT:6h}

filesender.baseurl=${FILE_SENDER_BASE_URL}
filesender.username=${FILE_SENDER_USER_NAME}
filesender.apikey=${FILE_SENDER_API_KEY}
management.endpoint.health.enabled=${MANAGEMENT_ENDPOINT_HEALTH_ENABLED}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINT_WEB_EXPOSURE_INCLUDE}
management.info.env.enabled=true
management.info.build.enabled=true
management.info.git.enabled=true
# default OFF. SMTP probe to smtp.inrae.fr fails on non-INRAE
# networks and pins one Tomcat thread per 35 s probe ; opt-in only.
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
management.health.db.enabled=true
management.health.ping.enabled=true
management.health.diskspace.enabled=true
management.endpoint.health.show-components=always
management.endpoint.health.show-details=always
info.application.name=openADOM Application
info.application.description=This is the openAdom application
info.application.version=2.0.1
info.spring.version=3.3.3
info.postgresql.version=${POSTGRES_VERSION}
spring.flyway.locations=classpath:migration/main
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.placeholders.publicRoleId=${SPRING_FLYWAY_PLACEHOLDERS_PUBLIC-ROLE-ID}
# Pour application.properties
#spring.flyway.logging=DEBUG
#logging.level.org.flywaydb=DEBUG
#logging.level.org.springframework.jdbc=TRACE
logging.level.fr.inra.oresing=DEBUG
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAXFILESIZE:1MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAXREQUESTSIZE:1MB}
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=${SPRING_SERVLET_ENCODING_FORCE}
viewStrategy=${VIEW_STRATEGY}
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.test-connection=${SPRING_MAIL_TEST-CONNECTION}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTSSL_ENABLE}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTSSL_REQUIRED}
spring.mail.from=${MAIL_FROM}
fr.inra.oresing.charte.default=classpath:charte/default_charte.pdf
#
#spring.mvc.problemdetails.enabled=true
#logging.level.org.springframework.security=TRACE
#spring.reactor.context-propagation=auto
spring.security.strategy=MODE_INHERITABLETHREADLOCAL
spring.threads.virtual.enabled=${SPRING_THREADS_VIRTUAL_ENABLED:false}

# PERF #58 - Compression gzip des réponses HTTP volumineuses ( ex : filtres ~1.7 MB -> ~200 KB )
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/x-ndjson,text/plain

spring.task.execution.pool.max-size=${POOL_MAX_SIZE:16}
spring.task.execution.pool.queue-capacity=${POOL_QUEUE_CAPACITY:100}
spring.task.execution.pool.keep-alive=${POOL_KEEP_ALIVE:10s}
spring.task.execution.thread-name-prefix=${POOL_THREAD_PREFIX:openadom-exec-}

#######################################################################
# Pipeline d'import CSV ( cascade ) - issue #62                       #
#                                                                     #
# Defauts portes par fr.inra.oresing.workflow.cascade.config.ImportProperties .
# Surchargeables au runtime via les env vars CASCADE_IMPORT_* exposees#
# dans local_deployment/backend/compose.yml ( elle-meme nourrie par   #
# local_deployment/.env ).                                            #
#######################################################################
cascade.import.chunk-size-lines=${CASCADE_IMPORT_CHUNK_SIZE_LINES:1000}
cascade.import.parallelism=${CASCADE_IMPORT_PARALLELISM:4}
cascade.import.progress-batch-size=${CASCADE_IMPORT_PROGRESS_BATCH_SIZE:100}
cascade.import.max-errors-threshold=${CASCADE_IMPORT_MAX_ERRORS_THRESHOLD:100}
cascade.import.chunks-temp-dir=${CASCADE_IMPORT_CHUNKS_TEMP_DIR:/tmp/openadom-import/chunks}
cascade.import.processed-temp-dir=${CASCADE_IMPORT_PROCESSED_TEMP_DIR:/tmp/openadom-import/processed}
cascade.import.max-concurrent-per-user=${CASCADE_IMPORT_MAX_CONCURRENT_PER_USER:3}
cascade.import.collector-chunk-size=${CASCADE_IMPORT_COLLECTOR_CHUNK_SIZE:0}
cascade.import.enable-metrics=${CASCADE_IMPORT_ENABLE_METRICS:false}
# Plafonds mémoire des caches d'import ( stratégie lazy : seules les valeurs
# vues >= 2 fois sont mises en cache ).
#  - Axe A ( ReferenceType.precomputedResults ) : lookup référentiel.
#  - Axe B ( DataValidator.groovyTransformationCache ) : transformation Groovy.
cascade.import.reference-cache-max-entries=${CASCADE_IMPORT_REFERENCE_CACHE_MAX_ENTRIES:5000}
cascade.import.groovy-cache-max-entries=${CASCADE_IMPORT_GROOVY_CACHE_MAX_ENTRIES:1000}

#######################################################################
# cascade 2.1.0 : pipeline mode + sink strategy ( bench-platform flags )
#######################################################################
# Sink strategy ( MERGE_FILE = legacy , DIRECT_COPY = new staging-based )
cascade.import.sink-strategy=${CASCADE_IMPORT_SINK_STRATEGY:MERGE_FILE}

# Cascade pipeline mode ( STAGED = transform stage barrier before sink stage ;
# PIPELINED = transform/sink overlap via bounded queue ) . See cascade 2.1.0
# PipelineMode javadoc for the migration mapping from cascade 2.0 axes .
cascade.import.pipeline-mode=${CASCADE_IMPORT_PIPELINE_MODE:STAGED}

# Staging strategy under DIRECT_COPY .
#  - PER_CONNECTION_TEMP : sticky single connection , 1 sink serial , atomic
#    via TEMP table . Recommande pour tests / dev . NON RECUPERABLE en cas
#    de SIGKILL ( la TEMP meurt avec la connexion , aucune trace en base ) .
#  - SHARED_UNLOGGED ( defaut prod ) : table UNLOGGED permanente partagee
#    avec tag correlation_id . Workers paralleles . Survit au crash JVM
#    -> rows recuperables via IntegrityService.reprocess et sweeper orphan .
#  - PER_WORKFLOW_TABLE : 1 table UNLOGGED dediee par workflow , isolation
#    native , DROP atomique . Survit au crash JVM .
cascade.import.staging-strategy=${CASCADE_IMPORT_STAGING_STRATEGY:SHARED_UNLOGGED}

# Shared UNLOGGED staging table name ( must exist via Flyway migration ; schema-qualified )
cascade.import.staging-shared-table-name=${CASCADE_IMPORT_STAGING_SHARED_TABLE_NAME:oa_staging.referencevalue_import_shared}

# Shared UNLOGGED orphan TTL minutes ( cleanup-after-crash sweep )
cascade.import.staging-shared-orphan-ttl-minutes=${CASCADE_IMPORT_STAGING_SHARED_ORPHAN_TTL_MINUTES:60}

# Skip CSV re-encoding in DataImporter.prepareContextForDataTreatment
# Risky : assumes input CSV has no multi-line cells / unescaped quotes
cascade.import.skip-csv-reencoding=${CASCADE_IMPORT_SKIP_CSV_REENCODING:false}

# Postgres SET LOCAL statement_timeout applique au debut de la finalize
# hook ( UPSERT staging -> referencevalue ) . Garde-fou contre les UPSERTs
# bloques infiniment ( deadlock pur , lock advisory non release ) que le
# heartbeat ne detecte pas ( cf P1 #4 javadoc : heartbeat = liveness probe
# pas success probe ) . Doit etre superieur au temps legitime maximal d'un
# finalize ( gros UPSERT 1M+ rows ) . 0 = pas de timeout ( deconseille
# en prod , reserve aux tests ) . Defaut : 180 min ( 3h ) .
cascade.import.finalize-statement-timeout-minutes=${CASCADE_IMPORT_FINALIZE_STATEMENT_TIMEOUT_MINUTES:180}

# =====================================================================
# Compensation log : recovery automatique des operations interrompues
# =====================================================================
# Activable / desactivable . Si false , les rows orphelines ne seront
# nettoyees que par intervention manuelle via la page admin "Integrite" .
app.compensation.sweep.enabled=${APP_COMPENSATION_SWEEP_ENABLED:true}

# Cron du sweeper ( default : 3h du matin tous les jours )
app.compensation.sweep.cron=${APP_COMPENSATION_SWEEP_CRON:0 0 3 * * *}

# TTL avant qu'une row PENDING soit consideree orpheline ( minutes ; default 4h )
app.compensation.sweep.orphan-ttl-minutes=${APP_COMPENSATION_SWEEP_ORPHAN_TTL_MINUTES:240}

# Max rows traitees par sweep run
app.compensation.sweep.batch-size=${APP_COMPENSATION_SWEEP_BATCH_SIZE:100}

# Retention des rows FAILED ( jours , 0 = jamais purger )
app.compensation.failed-retention-days=${APP_COMPENSATION_FAILED_RETENTION_DAYS:7}

# =====================================================================
# Workflow lifecycle : pre-persist IN_PROGRESS + zombie detection +
# heartbeat ( cf V4 / V5 migrations ) .
# =====================================================================
# Frequence d'emission du heartbeat pendant les phases longues
# ( finalize hook UPSERT staging -> referencevalue ) . Le thread dedie
# {@code HeartbeatService} ecrit {@code last_heartbeat_at} dans
# {@code oa_audit.workflow_log} toutes les N sec . Cost negligeable
# ( 1 UPDATE indexed par workflow actif / 30 sec ) .
app.workflow.heartbeat-interval-seconds=${APP_WORKFLOW_HEARTBEAT_INTERVAL_SECONDS:30}

# Seuil ( minutes ) au-dela duquel un workflow IN_PROGRESS sans heartbeat
# est presume mort et passe a CANCELLED par le sweeper . S'applique sur
# COALESCE ( last_heartbeat_at , start_time ) , donc :
#  - workflows avec heartbeat finalize OU cascade lifecycle : 10 min OK
#    ( marge x20 sur l'interval beat 30 sec )
#  - workflows sans heartbeat ( phase courte , pre-V5 ) : start_time
#    fallback ; relever a 30+ pour eviter faux positifs
# Bumpé 5 -> 10 en cascade 2.2.0 : la phase SOURCE/TRANSFORM est désormais
# couverte par WorkflowAliveEvent côté lib + DbHeartbeatListener côté
# openADOM , donc faux positifs quasi impossibles avant 10 min de silence
# total . Marge supplémentaire face aux pauses GC longues / pression DB .
app.workflow.zombie-threshold-minutes=${APP_WORKFLOW_ZOMBIE_THRESHOLD_MINUTES:10}

# Cron du zombie sweeper ( default : toutes les 5 min ) . UPDATE indexed
# tres leger , la frequence elevee n'est pas couteuse .
app.workflow.zombie-sweep-cron=${APP_WORKFLOW_ZOMBIE_SWEEP_CRON:0 */5 * * * *}

# Active / desactive le @Scheduled WorkflowZombieSweeper . Off : aucun
# auto-cancel des workflows IN_PROGRESS bloques ( utile en debug pour
# laisser un workflow vivre apres GC pause longue ) . En prod : true .
app.workflow.zombie-enabled=${APP_WORKFLOW_ZOMBIE_ENABLED:true}

# =====================================================================
# Cascade lifecycle heartbeat ( cascade 2.2.0 )
# =====================================================================
# Cascade emet un evenement WorkflowAliveEvent toutes les N secondes pour
# chaque workflow actif qui montre une activite cote chunk . Le bridge
# DbHeartbeatListener consomme cet evenement pour mettre a jour
# last_heartbeat_at dans oa_audit.workflow_log . Couvre les phases SOURCE /
# TRANSFORM / SINK ( ce que le HeartbeatService finalize ne couvrait pas ) .
# Si false : aucun beat cote cascade ; le sweeper retombe sur start_time
# fallback , donc un workflow long ( >10 min ) sans phase finalize sera
# faux-positif sweep si la threshold reste a 10 min .
app.workflow.cascade-heartbeat.enabled=${APP_WORKFLOW_CASCADE_HEARTBEAT_ENABLED:true}

# Periode du scheduler interne cascade ( ms ) . Defaut 30000 ms = 30 sec .
# Cost negligeable : 1 UPDATE indexe par workflow actif / N sec .
app.workflow.cascade-heartbeat.period-ms=${APP_WORKFLOW_CASCADE_HEARTBEAT_PERIOD_MS:30000}

# Quotas extraction ( cf. ExtractionRateLimiter )
cascade.extraction.max-concurrent-per-user=${CASCADE_EXTRACTION_MAX_CONCURRENT_PER_USER:5}
cascade.extraction.acquire-timeout-seconds=${CASCADE_EXTRACTION_ACQUIRE_TIMEOUT_SECONDS:0}

#######################################################################
# Cascade - pools partages + virtual threads                          #
#                                                                     #
# Cascade lit ces parametres SOIT depuis les system properties        #
# JVM ( -Dcascade.pool.source=N ) , SOIT depuis les env vars          #
# CASCADE_POOL_SOURCE=N. Spring ne les expose PAS lui-meme : elles    #
# transitent directement de l'environnement vers cascade.             #
#                                                                     #
# Variables disponibles ( vide = use cascade default = 4 threads ,    #
# queue 100 ) :                                                       #
#                                                                     #
#   CASCADE_POOL_SOURCE / TRANSFORM / SINK / ORDERING                 #
#   CASCADE_POOL_{stage}_QUEUE                                        #
#   CASCADE_VIRTUAL_THREADS                                           #
#                                                                     #
# Commentaire informatif uniquement ; les valeurs sont definies dans  #
# local_deployment/.env et propagees via local_deployment/backend/    #
# compose.yml.                                                        #
#######################################################################

#######################################################################
# Securite : duree de vie du JWT en secondes ( default 3600 = 1h ) .  #
# Override via la var d'env JWT_EXPIRATION ( cf. local_deployment ) . #
#######################################################################
jwt.expiration=${JWT_EXPIRATION:3600}

spring.data.web.pageable.serialization-mode=


