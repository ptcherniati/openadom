# Configuration for development mode
# Need to be overridden in final bundle
spring:
  docker:
    compose:
      enabled: false
  config:
    import: optional:file:.env-default[.properties],optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST_PORT}/${DB_DATABASE}?preparedStatementCacheQueries=0
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION-TIMEOUT:30000}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM-IDLE:2}
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM-POOL-SIZE:10}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE-TIMEOUT:600000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX-LIFETIME:1800000}
      auto-commit: ${SPRING_DATASOURCE_HIKARI_AUTO-COMMIT:true}

  flyway:
    locations: classpath:migration/main
    enabled: true
    baseline-on-migrate: true
    postgresql-transactional-lock: false
    placeholders:
      publicRoleId: ${SPRING_FLYWAY_PLACEHOLDERS_PUBLIC-ROLE-ID}
    # logging: DEBUG
    # validate-on-migrate: false

  servlet:
    multipart:
      enabled: true
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAXFILESIZE:1MB}
      file-size-threshold: 10MB
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAXREQUESTSIZE:1MB}
      location: ${TEMP_DIR:/tmp/openadom-import}/uploads
    encoding:
      charset: UTF-8
      force: ${SPRING_SERVLET_ENCODING_FORCE}

  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    test-connection: ${SPRING_MAIL_TEST-CONNECTION}
    from: ${MAIL_FROM}
    properties:
      mail:
        smtp:
          ssl:
            trust: smtp.inrae.fr
        starttls:
          enable: ${SPRING_MAIL_SMTP_STARTSSL_ENABLE}
          required: ${SPRING_MAIL_SMTP_STARTSSL_REQUIRED}

  security:
    strategy: MODE_INHERITABLETHREADLOCAL

  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:false}

  task:
    execution:
      pool:
        max-size: ${POOL_MAX_SIZE:16}
        queue-capacity: ${POOL_QUEUE_CAPACITY:100}
        keep-alive: ${POOL_KEEP_ALIVE:10s}
      thread-name-prefix: ${POOL_THREAD_PREFIX:openadom-exec-}

  # mvc:
  #   problemdetails:
  #     enabled: true

  # reactor:
  #   context-propagation: auto

server:
  port: ${SERVER_PORT}

  shutdown: graceful
  tomcat:
    threads:
      # Maximum 100 concurrent requests
      max: 100
      # Minimum 10 threads always active
      min-spare: 5
    # 100 active + 500 in queue
    max-connections: 600
    # Maximum queue size
    accept-count: 500
    # Connection timeout in milliseconds ( 60s )
    connection-timeout: 60000
    # Enable Tomcat metrics
    # ex : /actuator/metrics/http.server.requests.active
    mbeanregistry:
      enabled: true

allowed:
  origin: ${ALLOWED_ORIGIN:http://localhost:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    server-url: ${SWAGGER-UI-URI:${allowed.origin}}
    disable-swagger-default-url: true
  api-docs:
    path: /api-docs

filesender:
  baseurl: ${FILE_SENDER_BASE_URL}
  username: ${FILE_SENDER_USER_NAME}
  apikey: ${FILE_SENDER_API_KEY}
# =========================
# Configuration de l'import CSV via cascade ( phase 1e , #62 ).
# Remplace l'ancienne section workflow.* du JAR file-processor.
# =========================
app:
  import:
    chunk-size-lines: ${APP_IMPORT_CHUNK_SIZE_LINES:1000}
    parallelism: ${APP_IMPORT_PARALLELISM:2}
    progress-batch-size: ${APP_IMPORT_PROGRESS_BATCH_SIZE:100}
    max-errors-threshold: ${APP_IMPORT_MAX_ERRORS_THRESHOLD:100}
    chunks-temp-dir: ${APP_IMPORT_CHUNKS_TEMP_DIR:/tmp/openadom-import/chunks}
    processed-temp-dir: ${APP_IMPORT_PROCESSED_TEMP_DIR:/tmp/openadom-import/processed}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics,flyway,beans,logfile,loggers,env,configprops"
  endpoint:
    health:
      show-components: always
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true
    build:
      enabled: true
    git:
      enabled: true
  health:
    show-details: always
    mail:
      enabled: true
    db:
      enabled: true
    ping:
      enabled: true
    diskspace:
      enabled: true
  metrics:
    tags:
      application: oresing-backend
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.75,0.95,0.99
      data:
        repository:
          autotime:
            enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

info:
  application:
    name: openADOM Application
    description: This is the openAdom application
    version: 2.0.1
  spring:
    version: 4.0.0
  postgresql:
    version: 18

logging:
  level:
    root: INFO
    fr.inra.oresing: DEBUG
    # org.springframework.jdbc: TRACE
    # org.flywaydb: DEBUG
    # org.springframework.security: TRACE
    # org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

viewStrategy: ${VIEW_STRATEGY}

fr:
  inra:
    oresing:
      charte:
        default: classpath:charte/default_charte.pdf