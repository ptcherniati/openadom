<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Import CSV sécurisé</title>
</head>
<body>
<h2>Connexion</h2>
<form id="loginForm">

    <input type="text" id="login" placeholder="Login" required  autocomplete="current-login"/>
    <input type="password" id="password" placeholder="Mot de passe" required autocomplete="current-password">
    <button type="submit">Se connecter</button>
</form>

<div id="fileSection" style="display:none;">
    <h2>Charger vos fichiers CSV</h2>
    <input type="file" id="csvFiles" multiple accept=".csv" />
    <select id="dataTypeSelect"></select>
    <button id="uploadBtn">Importer</button>
</div>


<pre id="output"></pre>
<script type="module" src="./bundle.js"></script>
</body>
</html>
