.st_test_template: &test_template
  image: maven:3.9.11-amazoncorretto-25
  stage: test
  needs: ["maven_build"]
  
  # AJOUT CRUCIAL : Services Docker pour Testcontainers
  services:
    - name: docker:dind
      alias: docker
      command: ['--tls=false']
  
  # AJOUT : Variables pour Testcontainers
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_RYUK_DISABLED: "true"
    TESTCONTAINERS_CHECKS_DISABLE: "true"
  
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/*.xml
    paths:
      - target/surefire-reports/
      - target/logs/
  
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository/
    policy: pull
  
  script:
    - |
      # Configuration du profil Maven
      if [[ "$CI_JOB_NAME" == "test_all" ]]; then
          export MAVEN_PROFILE=all-tests
      else
          export MAVEN_PROFILE=$(echo "$CI_JOB_NAME" | sed -e 's/^test_//' -e 's/_/./')
      fi
      echo "Utilisation du profil Maven: $MAVEN_PROFILE"
    
    # Attendre que Docker soit prêt
    - |
      echo "Vérification de Docker..."
      timeout 30 sh -c 'until docker info; do sleep 1; done' || (echo "Docker n'est pas disponible" && exit 1)
    
    # Lancer les tests
    - mvn $MAVEN_CLI_OPTS test -P$MAVEN_PROFILE
  
  tags:
    - docker

# Jobs de test (inchangés)
test_core_basic:
  <<: *test_template

test_core_config:
  <<: *test_template

test_core_auth:
  <<: *test_template

test_domain_model:
  <<: *test_template

test_domain_checker:
  <<: *test_template

test_domain_i18n:
  <<: *test_template

test_integration_rest:
  <<: *test_template

test_integration_persistence:
  <<: *test_template

test_app_monsoere:
  <<: *test_template

test_app_haute_frequence:
  <<: *test_template

test_app_acbb:
  <<: *test_template

test_app_olac:
  <<: *test_template

test_app_foret:
  <<: *test_template

test_app_pattern:
  <<: *test_template

test_app_recursivity:
  <<: *test_template

test_app_teledetection:
  <<: *test_template

test_no-tags:
