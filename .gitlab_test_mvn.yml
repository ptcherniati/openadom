.st_test_template: &test_template
  image: maven:3.9.11-amazoncorretto-25

  before_script:
    # Install docker cli ( mandatory for Testcontainers )
    - apt-get update -y
    - apt-get install -y docker.io
    # Check the connection to docker:dind
    - docker info
  stage: test
  needs: ["maven_build"]
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/*.xml
    paths:
      - target/surefire-reports/

  script:
    - |
      # Détermination du profil Maven
      if [[ "$CI_JOB_NAME" == "test_all" ]]; then
          export MAVEN_PROFILE=all-tests
      else
          export MAVEN_PROFILE=$(echo "$CI_JOB_NAME" | sed -e 's/^test_//' -e 's/_/./')
      fi
      echo "Utilisation du profil Maven: $MAVEN_PROFILE"
    - mvn test -P$MAVEN_PROFILE

test_core_basic:
  <<: *test_template

test_core_config:
  <<: *test_template

test_core_auth:
  <<: *test_template

test_domain_model:
  <<: *test_template

test_domain_checker:
  <<: *test_template

test_domain_i18n:
  <<: *test_template

test_integration_rest:
  <<: *test_template

test_integration_persistence:
