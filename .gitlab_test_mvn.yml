.st_test_template: &test_template
  image: maven:3.9.11-amazoncorretto-25
  stage: test
  needs: ["maven_build"]
  # Testcontainers a besoin de Docker — on attache le service Docker-in-Docker
  services:
    - name: docker:26.0.1-dind
      alias: docker
      command: ['--tls=false']
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/*.xml
    paths:
      - target/surefire-reports/
  script:
    - |
      # Par défaut, si le job est nommé "test_all" on ne filtre pas (profil all-tests)
      # Sinon, on retire le préfixe "test_" et on remplace le premier underscore par un point.
      if [[ "$CI_JOB_NAME" == "test_all" ]]; then
          export MAVEN_PROFILE=all-tests
      else
          export MAVEN_PROFILE=$(echo "$CI_JOB_NAME" | sed -e 's/^test_//' -e 's/_/./')
      fi
      echo "Utilisation du profil Maven: $MAVEN_PROFILE"
    - mvn test -P$MAVEN_PROFILE

test_core_basic:
  <<: *test_template

test_core_config:
  <<: *test_template

test_core_auth:
  <<: *test_template

test_domain_model:
  <<: *test_template

test_domain_checker:
  <<: *test_template

test_domain_i18n:
  <<: *test_template

test_integration_rest:
  <<: *test_template

test_integration_persistence:
  <<: *test_template

test_app_monsoere:
  <<: *test_template

test_app_haute_frequence:
  <<: *test_template

test_app_acbb:
  <<: *test_template

test_app_olac:
  <<: *test_template

test_app_foret:
  <<: *test_template

test_app_pattern:
  <<: *test_template

test_app_recursivity:
  <<: *test_template

test_app_teledetection:
  <<: *test_template

test_no-tags:
  <<: *test_template