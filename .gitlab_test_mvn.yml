.st_test_template: &test_template
  image: maven:3.9.11-amazoncorretto-25
  stage: test
  
  services:
    - name: docker:dind
      alias: docker
      command: [ '--tls=false' ]
  
  needs:
    - job: maven_build
      artifacts: true
  
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/*.xml
    paths:
      - target/surefire-reports/
  
  script:
    - |
      if [[ "$CI_JOB_NAME" == "test_all" ]]; then
          export MAVEN_PROFILE=all-tests
      else
          export MAVEN_PROFILE=$(echo "$CI_JOB_NAME" | sed -e 's/^test_//' -e 's/_/./')
      fi
      echo "Utilisation du profil Maven: $MAVEN_PROFILE"
    - mvn test -P$MAVEN_PROFILE


test_core_basic:
  <<: *test_template

test_core_config:
  <<: *test_template

test_core_auth:
  <<: *test_template

test_domain_model:
  <<: *test_template

test_domain_checker:
  <<: *test_template

test_domain_i18n:
  <<: *test_template

test_integration_rest:
  <<: *test_template

test_integration_persistence:
  <<: *test_template

test_app_monsoere:
  <<: *test_template

test_app_haute_frequence:
  <<: *test_template

test_app_acbb:
  <<: *test_template

test_app_olac:
  <<: *test_template

test_app_foret:
  <<: *test_template

test_app_pattern:
