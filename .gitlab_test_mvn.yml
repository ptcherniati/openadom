.st_test_template: &test_template
  image: maven:3.9.11-amazoncorretto-25

  services:
    - name: docker:dind
      alias: docker
      command: ["--tls=false"]

  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    MAVEN_OPTS: "-Djava.awt.headless=true -Dmaven.repo.local=./.m2/repository"

  before_script:
    # Installation Docker CLI statique (binaire autonome)
    - curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-25.0.5.tgz -o docker.tgz
    - tar xzvf docker.tgz
    - mv docker/* /usr/bin/
    - docker version
    - docker info

  stage: test
  needs: ["maven_build"]

  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/*.xml
    paths:
      - target/surefire-reports/

  script:
    - |
      if [[ "$CI_JOB_NAME" == "test_all" ]]; then
          export MAVEN_PROFILE=all-tests
      else
          export MAVEN_PROFILE=$(echo "$CI_JOB_NAME" | sed -e 's/^test_//' -e 's/_/./')
      fi
      echo "Utilisation du profil Maven: $MAVEN_PROFILE"

    - mvn test -P$MAVEN_PROFILE


test_core_basic:
  <<: *test_template

test_core_config:
  <<: *test_template

test_core_auth:
  <<: *test_template

test_domain_model:
  <<: *test_template

test_domain_checker:
  <<: *test_template

test_domain_i18n:
  <<: *test_template

test_integration_rest:
  <<: *test_template

test_integration_persistence:
  <<: *test_template

test_app_monsoere:
  <<: *test_template

test_app_haute_frequence:
  <<: *test_template

test_app_acbb:
  <<: *test_template

test_app_olac:
  <<: *test_template

test_app_foret:
  <<: *test_template

test_app_pattern:
  <<: *test_template

test_app_recursivity:
  <<: *test_template

test_app_teledetection:
  <<: *test_template

test_no-tags:
  <<: *test_template