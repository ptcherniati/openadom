# ── Template de base : tests sans Docker (unité, domaine, use-cases) ─────────
.st_test_template: &test_template
  image: maven:3.9.11-amazoncorretto-25
  stage: test
  needs: ["maven_build"]
  # Testcontainers a besoin de Docker — on attache le service Docker-in-Docker
  services:
    - name: docker:26.0.1-dind
      alias: docker
      command: ['--tls=false']
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/*.xml
    paths:
      - target/surefire-reports/
  script:
    - |
      if [[ "$CI_JOB_NAME" == "test_all" ]]; then
          export MAVEN_PROFILE=all-tests
      else
          export MAVEN_PROFILE=$(echo "$CI_JOB_NAME" | sed -e 's/^test_//' -e 's/_/./')
      fi
      echo "Utilisation du profil Maven: $MAVEN_PROFILE"
    - mvn --batch-mode test -P$MAVEN_PROFILE -Dsurefire.excludedGroups=docker-required

# ── Template Docker : tests d'intégration nécessitant Testcontainers/PostgreSQL ──
# Docker (DinD) est disponible globalement (services + variables dans .gitlab-ci.yml)
.st_docker_test_template: &docker_test_template
  image: maven:3.9.11-amazoncorretto-25
  stage: test
  needs: ["maven_build"]
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/*.xml
    paths:
      - target/surefire-reports/
  script:
    - |
      export MAVEN_PROFILE=$(echo "$CI_JOB_NAME" | sed -e 's/^test_//' -e 's/_/./')
      echo "Utilisation du profil Maven (Docker): $MAVEN_PROFILE"
    - mvn --batch-mode test -P$MAVEN_PROFILE -Dsurefire.excludedGroups=

test_core_basic:
  <<: *test_template

test_core_config:
  <<: *test_template

test_core_auth:
  <<: *test_template

test_domain_model:
  <<: *test_template

test_domain_checker:
  <<: *test_template

test_domain_i18n:
  <<: *test_template

# Ces jobs s'appuient sur AbstractIntegrationTest (@Tag("docker-required"))
# → template Docker : Testcontainers démarre un PostgreSQL via DinD
test_integration_rest:
