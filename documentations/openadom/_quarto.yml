project:
  type: website
  output-dir: _site

website:

  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: true
  repo-url: https://forgemia.inra.fr/anaee-dev/openadom/backend/-/tree/develop
  repo-actions: [ edit, source, issue ]
  title: "openadom"
  description: "Documentation des fichiers de configuration pour OpenADOM"
  favicon: /img/Logos_OA.svg
  site-url: https://dev.openadom.fr
  sidebar:
    logo: /img/Logos_OpernADOM.png
    background: rgb(102, 196, 196)
    page-navigation: true
    back-to-top-navigation: true
    reader-mode: true
    search: true
    collapse-level: 1
    border: true
    style: docked
    contents:
      - section: Introduction
        contents:
          - text: Introduction
            href: fichiers/introduction/introduction.qmd
