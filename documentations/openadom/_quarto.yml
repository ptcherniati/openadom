        contents:
          - text: Fichier de configuration minimale
            href: fichiers/examples/configuration_min/description.qmd
          - section: Composantes
            contents:
              - text: Example d'utilisation des composants
                href: fichiers/examples/meteo/description.qmd
              - text: Example d'utilisation des composantes dynamiques(sites)
                href: fichiers/examples/dynamicComponant/description.qmd
              - text: Example d'utilisation des composantes dynamiques (taxons)
                href: fichiers/examples/taxons/description.qmd
              - text: Example d'utilisation des composantes basiques
                href: fichiers/examples/basicComponents/description.qmd
  navbar:
    search: true
    background: rgb(102, 196, 196)
    left:
      - href: index.qmd
        text: Accueil
      - href: fichiers/readme.md
        text: Installation
      - href: fichiers/schema-example.qmd
        text: Fichier d'example
      - href: fichiers/autres/lexique_yaml.qmd
        text: Lexique
      - href: about.md
        text: A propos
    right:
      - icon: gitlab
        href: https://forgemia.inra.fr/anaee-dev/openadom
      - icon: oa
        href: https://openadom.fr
  page-footer:
    left: "Copyright 2025, OpenADOM"
    right:
      - icon: gitlab
        href: https://forgemia.inra.fr/anaee-dev/openadom

format:
  html:
    smooth-scroll: true
    theme:
      - minty
      - style/global.scss
    template-partials:
      - _extensions/section-meta/partials/title-block.html
    toc: true
    toc-expand: false
    toc-depth: 3
    number-sections: false
    code-fold: true
    code-tools: true
    highlight-style: kate
    mainfont: "Roboto, sans-serif"
    monofont: "Fira Code, monospace"
    include-in-header:
      text: |
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&family=Fira+Code&display=swap" rel="stylesheet">
    page-layout: full
    link-external-newwindow: true
    citations-hover: true
    footnotes-hover: true
    date-format: "DD MMMM YYYY"
    lang: fr-FR
    date: "last-modified"
    anchor-sections: true
    shift-heading-level-by: 1  # Convertit les h1 en h2 pour avoir des ancre

execute:
  freeze: auto