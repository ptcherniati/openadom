                  - section: Paramétrage des composants
                    href: fichiers/fichier_echange/data/components/components_description.qmd
                  - text: Verificateurs
                    href: fichiers/fichier_echange/data/verificateurs.qmd
                  - text: Validations
                    href: fichiers/fichier_echange/data/validations.qmd
                  - section: Dépôt de fichier (OA_submission)
                    href: fichiers/fichier_echange/data/submission/submission.qmd
                  - section: Autorisations (OA_autorisations)
                    href: fichiers/fichier_echange/data/authorizations/authorizations.qmd
