project:
  type: website
  output-dir: _site

website:
  repo-url: https://forgemia.inra.fr/anaee-dev/openadom/backend/-/tree/develop
  repo-actions: [edit, source, issue]
  title: "openadom"
  description: "Documentation des fichiers de configuration pour OpenADOM"
  favicon: /img/Logos_OA.svg
  site-url: https://dev.openadom.fr
  sidebar:
    page-navigation: true
    back-to-top-navigation: true
    reader-mode: true
    search: true
    collapse-level: 1
    background: primary
    border: true
    style: "docked"
    contents:
      - section: Introduction
        contents:
          - text: Introduction
            href: fichiers/introduction/1_Introduction.md
          - text: Fichier d'échange
            href: fichiers/introduction/1.2..Fichier d'échange.md
      - section: Fichiers d'échange
        contents:
          - text: Données
            href: fichiers/fichier_echange/data.md
          - text: Aide fichier
            href: fichiers/fichier_echange/aide_fichier.md
          - text: Etiquettes
            href: fichiers/fichier_echange/etiquettes.md
          - text: Basic Components
            href: fichiers/fichier_echange/basic_components.qmd
          - text: Computed Components
            href: fichiers/fichier_echange/computed_components.md
          - text: Dynamic Components
            href: fichiers/fichier_echange/dynamic_components.qmd
          - text: Constant Components
            href: fichiers/fichier_echange/constant_components.md
          - text: Pattern Components
            href: fichiers/fichier_echange/pattern_components.md
          - text: Verificateurs
            href: fichiers/fichier_echange/verificateurs.md
      - section: Pour aller plus loin
        contents:
          - text: Authorization
            href: fichiers/pour_aller_plus_loin/authorization.md
          - text: Component Qualifiers
            href: fichiers/pour_aller_plus_loin/component_qualifiers.md
          - text: Expression Groovy
            href: fichiers/pour_aller_plus_loin/expressionGroovy.md
          - text: Internationalisation i18n
            href: fichiers/pour_aller_plus_loin/internationnalisation_i18n.md
          - text: Submission
            href: fichiers/pour_aller_plus_loin/submission.md
      - section: Base de données
        contents: 
          - text: Introduction
            href: fichiers/autres/database.qmd
      - section: En réflexion
        contents: 
          - text: Introduction
            href: fichiers/enReflexion/a_savoir.md
          - text: Introduction
            href: fichiers/enReflexion/reference_checker.md
      - section: Exemples
        contents:
          - text: Fichier de configuration minimal
            href: fichiers/examples/configuration_min/description.qmd
  navbar:
    background: primary
    search: true
    left: 
      - href: index.qmd
        text: Accueil
      - href: fichiers/readme.md
        text: Installation
      - href: fichiers/schema_example.yaml
        text: Fichier d'example
      - href: fichiers/autres/lexique_yaml.qmd
        text: Lexique
      - href: about.md
        text: A propos
    right:
      - icon: github
        href: https://forgemia.inra.fr/anaee-dev/openadom
      - href: https://dev.openadom.fr
        icon: /img/Logos_OpernADOM.svg
  page-footer: 
    left: "Copyright 2025, OpenADOM"
    right: 
      - icon: github
        href: https://forgemia.inra.fr/anaee-dev/openadom

format:
  html:
    theme: 
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: true
    code-tools: true
    highlight-style: github
    mainfont: "Roboto, sans-serif"
    monofont: "Fira Code, monospace"
    include-in-header: 
      text: |
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&family=Fira+Code&display=swap" rel="stylesheet">
    page-layout: full
    link-external-newwindow: true
    citations-hover: true
    footnotes-hover: true
    date-format: "DD MMMM YYYY"
    lang: fr-FR
    date: "last-modified"

execute:
  freeze: auto
