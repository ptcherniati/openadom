OA_version: 2.0.1
OA_application:
  OA_defaultLanguage: fr
  OA_i18n:
    OA_title:
      fr: "Soumission avec scope de temporalité"
      en: "Submission with temporality scope"
  OA_comment: "L'application de test submission acvec une portée de composante temporelle"
  OA_name: submission_with_temporal_scope
  OA_version: 1.0.1

OA_data:
  t_zone_etude_zet:
    OA_naturalKey: #mandatory
      - zet_id  #optional
    OA_tags: #optional
      - __DATA__
    OA_i18n: #mandatory
      OA_title: #optional
        fr: "Zone d'étude"
        en: "Study area"
      OA_description: #optional
        fr: "Référentiel des zones d'études"
        en: "Study area repository"

    OA_basicComponents: #optional
      zet_date:
        OA_importHeader: "date"
        OA_tags: [ __ORDER_1__ ]
        OA_checker:
          OA_name: OA_date
          OA_params:
            OA_pattern: dd/MM/yyyy
      zet_id: #optional
        OA_tags: [ __ORDER_2__ ]
        OA_langRestrictions: #optional
          - fr  #optional
          - en  #optional
        OA_required: true  #optional
        OA_importHeader: "ID zone étude"  #optional
    OA_submission: #optional
      OA_strategy: OA_VERSIONING
      OA_submissionScope:
        OA_timeScope:
          OA_component: zet_date