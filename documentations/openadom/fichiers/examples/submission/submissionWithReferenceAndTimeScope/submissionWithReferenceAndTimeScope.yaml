OA_version: 2.0.1
OA_application:
  OA_defaultLanguage: fr
  OA_i18n:
    OA_title:
      fr: "Soumission avec portée référentielle et temporelle"
      en: "Submission with references and temporaly scope"
  OA_comment: "L'application de test submission avec une portée de composante référentielle site et temporelle"
  OA_name: submission_with_reference_and_time_scope
  OA_version: 1.0.1
OA_data:
  tr_sites_sit:
    OA_naturalKey: [ sit_code ]
    OA_i18n: #mandatory
      OA_title: #optional
        fr: "Sites"
        en: "Sites"
    OA_i18nDisplayPattern:
      OA_title:
        fr: >-
          {site_fr}
        en: >-
          {site_en}
    OA_basicComponents:
      sit_code:
        OA_tags: [ __HIDDEN__ ]
        OA_importHeader: site
        OA_exportHeader:
          OA_title:
            fr: Site
            en: Site
      site_fr:
        OA_langRestrictions:
          - fr
        OA_exportHeader:
          OA_title:
            fr: Site
      site_en:
        OA_langRestrictions:
          - en
        OA_exportHeader:
          OA_title:
            en: Site
  t_zone_etude_zet:
    OA_naturalKey: #mandatory
      - zet_date  #optional
      - zet_sit_id  #optional
    OA_tags: #optional
      - __DATA__
    OA_i18n: #mandatory
      OA_title: #optional
        fr: "Zone d'étude"
        en: "Study area"
      OA_description: #optional
        fr: "Référentiel des zones d'études"
        en: "Study area repository"

    OA_basicComponents:
      zet_date:
        OA_importHeader: "date"
        OA_tags: [ __ORDER_1__ ]
        OA_checker:
          OA_name: OA_date
          OA_params:
            OA_pattern: dd/MM/yyyy
      zet_sit_id:
        OA_importHeader: "site"
        OA_tags: [ __ORDER_2__ ]
        OA_checker:
          OA_name: OA_reference
          OA_params:
            OA_reference:
              OA_name: tr_sites_sit
    OA_submission: #optional
      OA_strategy: OA_VERSIONING
      OA_submissionScope:
        OA_referenceScopes:
          - OA_component: zet_sit_id
            OA_reference: tr_sites_sit
            OA_i18n:
              OA_title:
                fr: Site
                en: Site
              OA_description:
                fr: Choisissez le site
                en: Choose the site
            OA_exportHeader:
              OA_title:
                fr: site
                en: site
        OA_timeScope:
          OA_component: zet_date