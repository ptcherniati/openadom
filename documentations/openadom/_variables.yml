openadom:
  version: 2.0.1
link-styles:
  primary:
    href: "{href}"
    text: "{text}"
    link: '[{text}]({href}){.btn .btn-primary}'
  secondary:
    href: "{href}"
    text: "{text}"
    link: '[{text}]({href}){.btn .btn-secondary}'
  outline:
    href: "{href}"
    text: "{text}"
    link: '[{text}]({href}){.btn .btn-outline-primary}'
  badge:
    href: "{href}"
    text: "{text}"
    link: '[{text}]({href}){.badge .bg-primary}'
  icon:
    href: "{href}"
    text: "{text}"
    link: '[:icon-{icon}:]({href}){.btn-icon}'
  card:
    href: "{href}"
    text: "{text}"
    link: '::: {.card} [{text}]({href}) :::'
page-refs:
  index: 
    ancre:  "[Créer une ancre](/index.qmd)" #chemin absolu depuis openadom
