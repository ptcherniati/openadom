build_openadom_doc:
  # rocker/verse:4.4.2 : image epinglee incluant quarto + tidyverse (evite les regressions :latest)
  image: rocker/verse:4.4.2
  stage: build
  script:
    - set -x
    - "R --version | head -1"
    - quarto --version
    # Binaires pre-compiles Posit (Ubuntu Noble 24.04) - evite cmake/compilation systeme
    - Rscript -e "install.packages(c('rmarkdown', 'knitr'), repos='https://packagemanager.posit.co/cran/__linux__/noble/latest')"
    - cp README.md documentations/openadom/fichiers/readme.md
    - cp src/test/resources/data/configuration/schemaExample.yaml documentations/openadom/fichiers/schema_example.yaml
    - cd documentations/openadom
    - quarto render
    - cd ../..
    - mkdir -p public
    - mv documentations/openadom/_site/* public/
  artifacts:
    paths:
      - public

pages:
  stage: pages
  needs: [ "build_openadom_doc" ]
  script:
    - ls public
  artifacts:
    paths:
      - public