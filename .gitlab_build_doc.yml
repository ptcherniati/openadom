build_openadom_doc:
  image: rocker/verse:latest
  stage: build
  script:
    - set -x
    - cp README.md documentations/openadom/fichiers/README.md
    - cd documentations/openadom
    - ls
    - Rscript -e "install.packages('quarto')"
    - quarto render
    - pwd
    - cd ../..
    - ls
    - mv documentations/openadom/_site public/
  artifacts:
    paths:
      - public
    #rules:
    #  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

    #rules:
    #- if: ($CI_JOB_MANUAL== "true" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH)

pages:
  stage: pages
  needs: ["build_openadom_doc"]
  script:
    - ls public
