build_openadom_doc:
pages:
  image: rocker/verse:latest
  stage: deploy
  script:
    - cd documentations/openadom
    - Rscript -e "install.packages('quarto')"
    - quarto render
    - mv _site public
  artifacts:
    paths:
      - public
