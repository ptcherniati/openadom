build_openadom_doc:
  image: ghcr.io/quarto-dev/quarto:latest
  stage: build
  variables:
    DEBIAN_FRONTEND: noninteractive
    TZ: Europe/Paris
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends nodejs npm r-base tzdata
    - npm install -g mermaid-cli
    - Rscript -e "install.packages(c('rmarkdown', 'knitr'), repos='https://cloud.r-project.org')"
  script:
    - cp README.md documentations/openadom/fichiers/readme.md
    - cp src/test/resources/data/configuration/schemaExample.yaml documentations/openadom/fichiers/schema_example.yaml
    - cd documentations/openadom
    - quarto render
    - cd ../..
    - mkdir -p public
    - mv documentations/openadom/_site/* public/
  artifacts:
    paths:
      - public

pages:
  stage: pages
  needs: ["build_openadom_doc"]
  script:
    - ls public
  artifacts:
    paths:
      - public
