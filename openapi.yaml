paths:
  /api/v1/users:
    put:
      tags:
        - authentication-resources
      operationId: updateUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "400":
          description: Bad Request
          content:
            application/hal+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ObjectError"
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUserResult"
    post:
      tags:
        - authentication-resources
      operationId: createUser
      parameters:
        - name: login
          in: query
          required: true
          schema:
            type: string
        - name: password
          in: query
          required: true
          schema:
            type: string
        - name: email
          in: query
          required: true
          schema:
            type: string
      responses:
        "400":
          description: Bad Request
          content:
            application/hal+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ObjectError"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                  format: uuid
  /api/v1/authorization/{role}:
    put:
      tags:
        - authorization-resources
      summary: Add an authorization for a user
      description: This service allows adding a specific authorization for a given
        user.
      operationId: addAuthorization
      parameters:
        - name: role
          in: path
          description: The role to add
          required: true
          schema:
            type: string
          examples:
            applicationManager:
              description: Application manager role
              value: applicationManager
            userManager:
              description: User manager role
              value: userManager
            openAdomAdmin:
              description: OpenAdom administrator role
              value: openAdomAdmin
            applicationCreator:
              description: Application creator role
              value: applicationCreator
        - name: userIdOrLogin
          in: query
          description: The user's ID or login
          required: true
          schema:
            type: string
          examples:
            userLogin:
              description: User login
              value: john.doe
            userId:
              description: User ID
              value: user123
        - name: applicationNameOrId
          in: query
          description: The application name or ID (if applicable) for grant of applicationManager
            et userManager of the application
          required: false
          schema:
            type: string
          examples:
            applicationId:
              description: Application ID
              value: app-456
            applicationName:
              description: Application name
              value: SI_123
        - name: applicationPattern
          in: query
          description: The application pattern (if applicable) for grant of rôle applicationCreator
          required: false
          schema:
            type: array
            items:
              type: string
          examples:
            applicationPattern:
              description: Pattern for SI applications
              value: SI_*
      responses:
        "400":
          description: Invalid request
          content:
            application/hal+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ObjectError"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OreSiUser"
        "200":
          description: Authorization successfully added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OreSiUser"
        "404":
          description: User or role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OreSiUser"
    delete:
      tags:
        - authorization-resources
      summary: Remove an authorization for a user
      description: This service allows removing a specific authorization for a given
        user.
      operationId: deleteAuthorization
      parameters:
        - name: role
          in: path
          description: The role to remove
          required: true
          schema:
            type: string
          examples:
            applicationManager:
              description: Remove application manager role
              value: applicationManager
            userManager:
              description: Remove user manager role
              value: userManager
            openAdomAdmin:
              description: Remove OpenAdom administrator role
              value: openAdomAdmin
            applicationCreator:
              description: Remove application creator role
              value: applicationCreator
        - name: userIdOrLogin
          in: query
          description: The user's ID or login
          required: true
          schema:
            type: string
          examples:
            userLogin:
              description: User login
              value: john.doe
            userId:
              description: User ID
              value: user123
        - name: applicationNameOrId
          in: query
          description: The application name or ID (if applicable) for revoke of applicationManager
            et userManager of the application
          required: false
          schema:
            type: string
          examples:
            applicationId:
              description: Application ID
              value: app-456
            applicationName:
              description: Application name
              value: SI_123
        - name: applicationPattern
          in: query
          description: The application pattern (if applicable) for revoke of an applicationCreator
          required: false
          schema:
            type: array
            items:
              type: string
          examples:
            applicationPattern:
              description: Pattern for SI applications
              value: SI_*
      responses:
        "400":
          description: Invalid request
          content:
            application/hal+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ObjectError"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OreSiUser"
        "404":
          description: User or role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OreSiUser"
        "200":
          description: Authorization successfully removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OreSiUser"
