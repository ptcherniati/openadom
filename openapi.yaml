  /api/v1/applications/{nameOrId}/data/{dataType}/json:
    get:
      tags:
        - ore-si-resources
      description: Return an extraction of data of datatType 'dataName' of application
        'nameOrId'
      operationId: getAllDataJson
      parameters:
        - name: downloadDatasetQuery
          in: query
          description: "An object for reduce, filter and order result"
          required: false
          $ref: fr.inra.oresing.persistence.requestBuilder.datatype.DownloadDatasetQuery
          schema:
            type: string
          examples:
            select filter by filter numeric):
              description: |2
                        {
                                "componentSelects": ["individusNumbervalue"],
                                "componentFilters": [
                                          {
                                            "componentKey": "individusNumbervalue",
                                            "filters": [41]
                                          }
                               ]
                             }
              value: Select by numeric. You can provide an optional json with componentFiltersé
              $ref: fr.inra.oresing.model.data.authorizationDescriptions.class
            select by rowIds:
              description: |2
                        {
                            "rowIds" : [ "59ae5fec-8ed5-495b-b201-5475ea50906e"]
                        }
              value: Find by RowIds. You can provide an optional json with rowIds
              $ref: fr.inra.oresing.model.data.read.DownloadDatasetQuery.class
            reduce by select:
              description: |2
                        {
                            "componentSelects": [sites, date]
                        }
              value: Select by. You can provide an optional json with componentSelects
              $ref: fr.inra.oresing.model.data.read.DownloadDatasetQuery.class
            select filter by filter date by interval (With declared pattern):
              description: |2
                        {
                            "componentFilters": [
                               {
                                     "componentKey": "date",
                                     "intervalsValues": [
                                        "from": "01/01/1984",
                                        "to": "04/01/1984"
                                     ]
                                   }
                            ]
                        }
              value: Select by interval of date. You can provide an optional json with
                componentFilters
              $ref: fr.inra.oresing.model.data.authorizationDescriptions.class
            general case:
              description: |2
                        {
                            "componentSelects": [...],
                            "componentFilters": [...],
                            "componentOrderBy": [...]
                        }
              value: "General case. You can provide an optional json with componentSelects,\
              \ rowIds, authorizationDescriptions, componentFilters, componentOrderBy"
              $ref: fr.inra.oresing.model.data.read.DownloadDatasetQuery.class
            select filter by filter numeric by interval):
              description: |2
                        {
                            "componentFilters": [
                               {
                                 "componentKey": {
                                   "variable": "Nombre d'individus",
                                   "component": "value"
                                 },
                                 "intervalsValues":[ {
                                    "from": 25,
                                    "to": 30
                                 }]
                               }
                            ]
                        }
              value: Select by interval of numeric. You can provide an optional json
                with componentFilters
              $ref: fr.inra.oresing.model.data.authorizationDescriptions.class
            select by submissionScope:
              description: |2
                        {
                                "authorizationDescriptions": [
                                          {
                                            "timeScope": {
                                              "from": "1984-01-01",
                                              "to": "1984-01-02"
                                            },
                                            "requiredAuthorizations": {
                                                "projet": "projetKprojet_manche",
                                                "sites": "type_de_sitesKplateforme.sitesKoir.sitesKoir__p1"
                                              }
                                          },
                                          {
                                            "timeScope": {
                                              "from": "1984-01-03",
                                              "to": "1984-01-04"
                                            },
                                            "requiredAuthorizations": {
                                                "projet": "projetKprojet_atlantique",
                                                "sites": "type_de_sitesKplateforme.sitesKoir.sitesKoir__p1"
                                              }
                                          }
                               ]
                             }
              value: Find by authorizations. You can provide an optional json with submissionScope
              $ref: fr.inra.oresing.model.data.authorizationDescriptions.class
            select filter by filter (like '%filter%'):
              description: |2
                        {
                            "componentFilters": [
                               {
                                 "componentKey": "bassin",
                                 "filters": ["nivelle"]
                               },
                               {
                                 "componentKey": "espece",,
                                 "filters": ["tr"]
                               }
                            ]
                        }
              value: Select by filter. You can provide an optional json with componentFilters
              $ref: fr.inra.oresing.model.data.authorizationDescriptions.class
            select by hierarchicalKey:
              description: |2
                        {
                            "naturalKey" : ["pemKprojet_manche__oir__p1__03_01_1984__lpm"]
                        }
              value: Find by naturalKeys. You can provide an optional json with naturalKeys
              $ref: fr.inra.oresing.model.data.read.DownloadDatasetQuery.class
            select filter by filter with regexp (~ '^[ao]m+):
              description: |2
                        {
                            "componentFilters": [
                               "componentFilters": [
                                     {
                                       "componentKey": "espece",
                                       "filters": ["^[ao]m+"],
                                       "isRegExp": "true"
                                     }
                            ]
                        }
              value: Select by RegExp. You can provide an optional json with componentFilters.
                Can be apply only on text not for reference.
              $ref: fr.inra.oresing.model.data.authorizationDescriptions.class
            select filter by filter date (With declared pattern):
              description: |2
                        {
                            "componentFilters": [
                               {
                                 "componentKey":"date",,
                                 "filters": ["12:45:00"]
                               }
                            ]
                        }
              value: Select by date. You can provide an optional json with componentFilters
              $ref: fr.inra.oresing.model.data.authorizationDescriptions.class
            order by:
              description: |2
                        {
                            "componentOrderBy": [
                                  {
                                     "componentKey": "espece",,
                                     "order": "ASC"
                                  }
                              ]
                        }
              value: Order by. You can provide an optional json with componentOrderBy
              $ref: fr.inra.oresing.model.data.read.DownloadDatasetQuery.class
            select by naturalKeys:
              description: |2
                        {
                            "naturalKey" : ["projet_manche__oir__p1__03_01_1984__lpm"]
                        }
              value: Find by naturalKeys. You can provide an optional json with naturalKeys
              $ref: fr.inra.oresing.model.data.read.DownloadDatasetQuery.class
