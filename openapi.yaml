  /api/v1/login:
    post:
      tags:
        - authentication-resources
      summary: Connexion utilisateur dans openadom
      description: Authentifie un utilisateur et retourne un token JWTqr+
      operationId: login
      parameters:
        - name: login
          in: query
          description: Identifiant de l'utilisateur
          required: true
          schema:
            type: string
          examples:
            Utilisateur standard:
              description: Utilisateur standard
              value: user123
            Admin:
              description: Admin
              value: admin
        - name: password
          in: query
          description: Mot de passe de l'utilisateur
          required: true
          schema:
            type: string
            format: password
      responses:
        "400":
          description: Bad Request
          content:
            application/hal+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ObjectError"
        "200":
          description: Authentification réussie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginAdminResult"
              examples:
                ExempleAdmin:
                  summary: Réponse typique pour un administrateur OpenAdom
                  description: ExempleAdmin
                  value:
                    id: 35157557-616a-46b8-aee3-487d7450ec23
                    login: admin_tech
                    email: admin@example.org
                    state: active
                    authorizedForApplicationCreation: true
                    openAdomAdmin: true
                    authorizations:
                      - appl.*
                      - SI_.*
                      - .*
                    chartes:
                      "1fd78157-8233-47b0-80bb-f2ffcb6e7b97": 2025-03-11T12:00:00Z
                      "20ad5120-3a78-4026-944f-601297aced5f": 2025-03-10T09:30:45Z
                    currentUserRoles:
                      applicationRoles:
                        "1fd78157-8233-47b0-80bb-f2ffcb6e7b97":
                          - applicationManager
                          - dataCurator
                          - userManager
                        "20ad5120-3a78-4026-944f-601297aced5f":
                          - auditor
                          - reviewer
                      userId: 35157557-616a-46b8-aee3-487d7450ec23
                      userLogin: admin_tech
                      isOpenAdomAdmin: true
                      isApplicationCreator: true
                      memberOf:
                        - 1fd78157-8233-47b0-80bb-f2ffcb6e7b97_applicationManager
                        - 20ad5120-3a78-4026-944f-601297aced5f_auditor
                        - openAdomAdmin
                      isDataBaseSuper: false
        "401":
          description: Requête invalide
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoginAdminResult"
              example:
                params: { }
                message: BAD_LOGIN_PASSWORD
                localizedMessage: BAD_LOGIN_PASSWORD
