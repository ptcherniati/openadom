                  $ref: "#/components/schemas/ObjectError"
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAuthorizationResults"
    post:
      tags:
        - authorization-resources
      summary: Créer une nouvelle autorisation
      description: Crée une nouvelle autorisation avec des permissions spécifiques
        pour différents types de données.
      operationId: addAuthorization_1
      parameters:
        - name: nameOrId
          in: path
          description: Nom ou ID de l'application
          required: true
          schema:
            type: string
      requestBody:
        description: Détails de l'autorisation à créer ou à mettre à jour
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAuthorizationRequest"
            examples:
              Autorisation complexe:
                summary: Exemple d'autorisation avec permissions générales et restrictions
                  spécifiques
                description: Autorisation complexe
                value:
                  uuid: null
                  name: atlantique extraction nivelle p1
                  description: une extraction sur nivelle
                  authorizationForAll:
                    sites:
                      - depot
                      - suppression
                  authorizationsWithRestriction:
                    pem:
                      operationTypes:
                        - extraction
                      requiredAuthorizations:
                        projet:
                          - projet_manche
                          - projet_atlantique
                        sites:
                          - oir__p1
                          - nivelle
                      timeScope:
                        fromDay: 1984-01-02
              Autorisation dépôt sur sites:
                summary: Autorisation pour le droit de dépôt sur sites
                description: Autorisation dépôt sur sites
                value:
                  uuid: null
                  name: Dépôt sur sites
                  description: Autorisation pour le dépôt sur tous les sites
                  authorizationForAll:
                    sites:
                      - depot
              Autorisation extraction PEM:
                summary: Autorisation pour le droit d'extraction sur PEM
                description: Autorisation extraction PEM
                value:
                  uuid: null
                  name: Extraction PEM
                  description: Autorisation pour l'extraction des données PEM
                  authorizationsWithRestriction:
                    pem:
                      operationTypes:
                        - extraction
              Autorisation extraction PEM avec période spécifique:
                summary: Autorisation pour l'extraction des données PEM entre deux
                  dates spécifiques
                description: Autorisation extraction PEM avec période spécifique
                value:
                  uuid: null
                  name: Extraction PEM période spécifique
                  description: Extraction PEM du 01/01/1984 au 02/01/1984
                  authorizationsWithRestriction:
                    pem:
                      operationTypes:
                        - extraction
                      timeScope:
                        fromDay: 1984-01-01
                        toDay: 1984-01-02
              Autorisation PEM bassin versant Nivelle:
                summary: Autorisation pour les données PEM du bassin versant de Nivelle
                description: Autorisation PEM bassin versant Nivelle
                value:
                  uuid: null
                  name: PEM Nivelle
                  description: Autorisation pour les données PEM du bassin versant
                    de Nivelle
                  authorizationsWithRestriction:
                    pem:
                      operationTypes:
                        - read
                        - extraction
                      requiredAuthorizations:
                        sites:
                          - nivelle
              Mise à jour d'une autorisation existante:
                summary: Exemple de mise à jour d'une autorisation existante
                description: Mise à jour d'une autorisation existante
                value:
                  uuid: b4a865cb-12a0-4688-b9d6-1385a65c52c1
                  name: Mise à jour autorisation
                  description: Mise à jour d'une autorisation existante
                  authorizationForAll:
                    sites:
                      - extraction
                  authorizationsWithRestriction:
                    pem:
                      operationTypes:
                        - depot
                      requiredAuthorizations:
                        projet:
                          - projet_atlantique
        required: true
      responses:
        "400":
          description: Requête invalide
          content:
            application/hal+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ObjectError"
        "404":
          description: Application non trouvée
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        "200":
          description: Autorisation créée ou mise à jour avec succès
          content:
            application/json:
              schema:
                type: string
              examples:
                Réponse standard:
                  description: Réponse standard
                  value:
                    message: Autorisation créée avec succès
                    id: b4a865cb-12a0-4688-b9d6-1385a65c52c1
