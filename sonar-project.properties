# ============================================================================
# sonar-project.properties — Configuration SonarQube locale openADOM backend
# Utilisé par : mvn sonar:sonar  (sans avoir à passer -Dsonar.* en ligne de commande)
# Pour l'analyse complète voir aussi : sonar-local.sh
# ============================================================================

sonar.host.url=https://sonarqube.dev.gissol.fr
sonar.projectKey=anaee-dev_openadom_backend_caf3d282-990e-4907-8f15-44424cf3c8b0
sonar.projectName=openADOM-backend

# ── Sources et encodage ──────────────────────────────────────────────────────
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.source=25
sonar.sourceEncoding=UTF-8

# ── Couverture (générée par jacoco:report) ───────────────────────────────────
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.java.coveragePlugin=jacoco
sonar.dynamicAnalysis=reuseReports

# ── Exclusions ───────────────────────────────────────────────────────────────
# Fichiers générés, migrations Flyway, configuration purement déclarative
sonar.exclusions=\
  target/**,\
  src/main/resources/migration/**,\
  src/main/resources/web/**,\
  **/generated/**

# ── CPD (détection de duplication) ──────────────────────────────────────────
# Ignorer les fichiers de migration SQL (nature répétitive attendue)
sonar.cpd.exclusions=src/main/resources/migration/**

# ── Quality Gate ─────────────────────────────────────────────────────────────
# false = l'analyse ne bloque pas le build local
# Le CI overrides avec -Dsonar.qualitygate.wait=true
sonar.qualitygate.wait=false

# ── Branches analysées ───────────────────────────────────────────────────────
# Edition Community : pas de séparation par branche — tout remonte sur le
# projet principal. Les branches sont indiquées à titre documentaire uniquement.
# Branches actives : develop, amelioration_sonar