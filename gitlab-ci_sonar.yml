image: maven:3.9.11-amazoncorretto-25

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Emplacement du cache de l'analyse Sonar
  GIT_DEPTH: "0"  # Récupère toutes les branches (requis par l'analyse Sonar)
  SONAR_HOST_URL: "https://sonarqube.dev.gissol.fr"
  MAVEN_OPTS: "-Djava.awt.headless=true -Dmaven.repo.local=./.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

stages:
  - sonarqube-check
  - sonarqube-vulnerability-report

sonarqube-check:
  stage: sonarqube-check
  script:
    # Phase 1 : compilation + tests unitaires (sans docker-required, DinD non disponible ici)
    - mvn ${MAVEN_CLI_OPTS} test
      -DexcludedGroups=docker-required
    # Phase 2 : analyse Sonar (réutilise le rapport Jacoco généré)
    - mvn ${MAVEN_CLI_OPTS} sonar:sonar
      -DskipTests
      -Dsonar.host.url=${SONAR_HOST_URL}
      -Dsonar.token=${SONAR_TOKEN}
      -Dsonar.qualitygate.wait=true
  allow_failure: true
  cache:
    key: "${CI_COMMIT_REF_SLUG}-sonar"
    paths:
      - .sonar/cache
      - .m2/repository/
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'

sonarqube-vulnerability-report:
  stage: sonarqube-vulnerability-report
  script:
    - 'curl -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/issues/gitlab_sast_export?projectKey=anaee-dev_openadom_backend_caf3d282-990e-4907-8f15-44424cf3c8b0&branch=${CI_COMMIT_BRANCH}&pullRequest=${CI_MERGE_REQUEST_IID}" -o gl-sast-sonar-report.json'
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'
  artifacts:
    expire_in: 1 day
    reports:
      sast: gl-sast-sonar-report.json