image: docker:stable


# Pour l'utilisation de testcontainers
# https://www.testcontainers.org/supported_docker_environment/continuous_integration/gitlab_ci/
# docker:26-dind → API Docker 1.45, compatible avec le client Testcontainers (API 1.44+)
# Ancienne version : docker:23.0.1-dind (API max 1.42 → incompatible)
services: &dind_definition
  - name: docker:26-dind
    alias: docker
    command: [ '--tls=false' ]

cache:
  paths:
    - ./.m2/repository
  # keep cache across branch
  key: "$CI_BUILD_REF_NAME"

variables:
  MAVEN_OPTS: "-Djava.awt.headless=true -Dmaven.repo.local=./.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  # Instruct Testcontainers to use the daemon of DinD.
  DOCKER_HOST: tcp://docker:2375
  # Improve performance with overlayfs.
  DOCKER_DRIVER: overlay2
  # Désactiver TLS : pas de certificat partagé dans cette config runner
  DOCKER_TLS_CERTDIR: ""
  # Désactiver Ryuk (resource reaper) : pas de socket unix /var/run/docker.sock en DinD
  TESTCONTAINERS_RYUK_DISABLED: "true"

stages:
  - build
  - pages
  - test
  - sonarqube-check
  - sonarqube-vulnerability-report
  - package
  # Docker image build
  - build_env
  - trigger   # trigger openadom/deployment

maven_build:
  image: maven:3.9.11-amazoncorretto-25
  stage: build
  script:
    - mvn --batch-mode clean compile test-compile -DskipTests
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository/
  artifacts:
    paths:
      - target/
  tags:
    - docker
  rules:
    - if: $CI_JOB_MANUAL!= "true"

include:
  # - local: .gitlab_test_mvn.yml
  # - local: .gitlab_test_ui.yml
  # - local: .gitlab_package.yml
  - local: .gitlab_build_doc.yml
    path: .
  - local: .gitlab_test_mvn.yml
    path: .
  - local: .gitlab-ci_docker.yml
    path: .
  - local: .gitlab-ci_sonar.yml
    path: .
# - local: .gitlab_build_doc2.yml